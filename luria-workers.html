<!-- 🔒 קוד PIN לכל מערכות לוריא — אותו קוד בכל הדפים (נובמבר 2026) -->
<style id="lf-lock-css">
html.lf-locked body{display:none!important}
#lf-lock{position:fixed;inset:0;z-index:2147483647;background:#14201a;color:#f3ead2;display:flex;align-items:center;justify-content:center;font-family:Heebo,Arial,sans-serif;direction:rtl}
#lf-lock .bx{width:min(340px,88vw);text-align:center}
#lf-lock h2{margin:0 0 6px;font-size:22px;color:#e2c46b}
#lf-lock p{margin:0 0 18px;font-size:14px;opacity:.85;line-height:1.5}
#lf-lock input{width:100%;box-sizing:border-box;font-size:28px;letter-spacing:10px;text-align:center;padding:12px;border-radius:12px;border:1px solid #6b5a2a;background:#0d1611;color:#fff;direction:ltr}
#lf-lock button{margin-top:12px;width:100%;padding:12px;border-radius:12px;border:1px solid #e2c46b;background:#e2c46b;color:#14201a;font-size:16px;font-weight:700;cursor:pointer}
#lf-lock button.ln{background:none;color:#cbbf9a;border:none;font-weight:400;font-size:13px;text-decoration:underline;margin-top:16px}
#lf-lock .er{min-height:20px;margin-top:10px;font-size:14px;color:#ff8a80}
@media print{#lf-lockbtn,#lf-lock{display:none!important}}
#lf-lockbtn{position:fixed;bottom:14px;right:14px;z-index:2147483646;width:38px;height:38px;border-radius:50%;border:1px solid rgba(226,196,107,.5);background:rgba(20,32,26,.75);color:#e2c46b;font-size:17px;cursor:pointer;opacity:.7}
</style>
<script>
(function () {
  var K_PIN = 'luria_pin_v1', K_ACT = 'luria_pin_active', K_FAIL = 'luria_pin_fail';
  var IDLE = 15 * 60 * 1000;             // ננעל אחרי 15 דקות בלי שימוש
  var OWNER = 'lurietrogim@gmail.com';
  var html = document.documentElement, box = null, lastW = 0;
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  function pin() { try { return JSON.parse(ls(K_PIN) || 'null'); } catch (e) { return null; } }
  function fresh() { return Date.now() - (+ls(K_ACT) || 0) < IDLE; }
  function touch() { var n = Date.now(); if (n - lastW > 20000 && !html.classList.contains('lf-locked')) { lastW = n; ls(K_ACT, String(n)); } }
  function b64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
  function unb64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function hashPin(code, salt, it) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveBits']).then(function (k) {
      return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: salt, iterations: it }, k, 256);
    }).then(b64);
  }
  function show(mode) {
    html.classList.add('lf-locked');
    if (!box) { box = document.createElement('div'); box.id = 'lf-lock'; html.appendChild(box); }
    var p = pin();
    if (mode === 'setup' || !p) {
      box.innerHTML = '<div class="bx"><h2>🔒 קוד כניסה למערכות לוריא</h2><p>בחר קוד של 4 עד 6 ספרות.<br>הקוד ישמש את כל המערכות במכשיר הזה.</p>' +
        '<input id="lf-a" type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="קוד חדש">' +
        '<input id="lf-b" type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="שוב, לאימות" style="margin-top:10px">' +
        '<button id="lf-ok">שמור קוד</button><div class="er" id="lf-er"></div></div>';
      var a = box.querySelector('#lf-a'), b2 = box.querySelector('#lf-b');
      setTimeout(function () { a.focus(); }, 50);
      box.querySelector('#lf-ok').onclick = function () {
        var x = a.value.trim(), y = b2.value.trim(), er = box.querySelector('#lf-er');
        if (!/^\d{4,6}$/.test(x)) { er.textContent = 'הקוד צריך להיות 4 עד 6 ספרות'; return; }
        if (x !== y) { er.textContent = 'שני הקודים לא זהים'; b2.value = ''; b2.focus(); return; }
        var salt = crypto.getRandomValues(new Uint8Array(16)), it = 150000;
        hashPin(x, salt, it).then(function (h) {
          ls(K_PIN, JSON.stringify({ s: b64(salt), h: h, i: it, l: x.length })); ls(K_FAIL, null); unlock();
        });
      };
      return;
    }
    box.innerHTML = '<div class="bx"><h2>🔒 מערכות לוריא</h2><p>הקש את הקוד</p>' +
      '<input id="lf-in" type="password" inputmode="numeric" autocomplete="off" maxlength="6">' +
      '<button id="lf-ok">כניסה</button><div class="er" id="lf-er"></div>' +
      '<button class="ln" id="lf-forgot">שכחתי את הקוד</button></div>';
    var inp = box.querySelector('#lf-in'), er = box.querySelector('#lf-er');
    setTimeout(function () { inp.focus(); }, 50);
    function wait() { var f = {}; try { f = JSON.parse(ls(K_FAIL) || '{}'); } catch (e) {} return Math.max(0, (f.until || 0) - Date.now()); }
    function check() {
      var w = wait(); if (w) { er.textContent = 'יותר מדי ניסיונות — נסה שוב בעוד ' + Math.ceil(w / 1000) + ' שניות'; return; }
      var code = inp.value.trim(); if (!code) return;
      hashPin(code, unb64(p.s), p.i).then(function (h) {
        if (h === p.h) { ls(K_FAIL, null); unlock(); return; }
        var f = {}; try { f = JSON.parse(ls(K_FAIL) || '{}'); } catch (e) {}
        f.n = (f.n || 0) + 1;
        if (f.n >= 5) f.until = Date.now() + Math.min(3600000, 30000 * Math.pow(2, f.n - 5));
        ls(K_FAIL, JSON.stringify(f));
        inp.value = ''; er.textContent = f.until && f.until > Date.now() ? 'קוד שגוי. ננעל ל-' + Math.ceil((f.until - Date.now()) / 1000) + ' שניות' : 'קוד שגוי';
      });
    }
    box.querySelector('#lf-ok').onclick = check;
    inp.onkeydown = function (e) { if (e.key === 'Enter') check(); };
    inp.oninput = function () { if (p.l && inp.value.length === p.l) check(); };
    box.querySelector('#lf-forgot').onclick = function () { forgot(er); };
  }
  function forgot(er) {
    er.style.color = '#cbbf9a'; er.textContent = 'נפתח חלון של גוגל — התחבר עם ' + OWNER;
    var base = 'https://www.gstatic.com/firebasejs/12.18.0/';
    Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js')]).then(function (m) {
      var A = m[0], Au = m[1];
      var app = A.getApps().length ? A.getApp() : A.initializeApp({ apiKey: 'AIzaSyDeEqKUSOUvlJadmkaJ_E9qx-BifkpnKg4', authDomain: 'luria-farm.firebaseapp.com', projectId: 'luria-farm', appId: '1:977449076829:web:2ef92d7bdb57690066a5b4' });
      var pr = new Au.GoogleAuthProvider(); pr.setCustomParameters({ prompt: 'select_account', login_hint: OWNER });
      return Au.signInWithPopup(Au.getAuth(app), pr);
    }).then(function (r) {
      if (String(r.user.email || '').toLowerCase() !== OWNER) { er.style.color = ''; er.textContent = 'רק החשבון ' + OWNER + ' יכול לאפס את הקוד'; return; }
      ls(K_PIN, null); ls(K_FAIL, null); show('setup');
    }).catch(function (e) { er.style.color = ''; er.textContent = 'האיפוס לא הצליח: ' + (e && (e.code || e.message) || e); });
  }
  function unlock() {
    ls(K_ACT, String(Date.now())); lastW = Date.now();
    html.classList.remove('lf-locked');
    if (box) { box.remove(); box = null; }
  }
  window.luriaLock = function () { ls(K_ACT, '0'); show(); };
  window.luriaChangePin = function () { show('setup'); };
  if (!pin() || !fresh()) show(); else touch();
  ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(function (ev) { addEventListener(ev, touch, { passive: true, capture: true }); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && pin() && !fresh()) show(); });
  setInterval(function () { if (pin() && !fresh() && !html.classList.contains('lf-locked')) show(); }, 30000);
  addEventListener('storage', function (e) { if (e.key === K_PIN && !e.newValue) show('setup'); });
  document.addEventListener('DOMContentLoaded', function () {
    var b = document.createElement('button'); b.id = 'lf-lockbtn'; b.title = 'נעילה'; b.textContent = '🔒';
    b.onclick = function () {
      if (confirm('🔒 לנעול את המערכות עכשיו?')) { window.luriaLock(); return; }
      if (confirm('לשנות את קוד הכניסה?')) window.luriaChangePin();
    };
    document.body.appendChild(b);
  });
})();
</script>

<script>
/* ======================= נתונים ותצוגה ======================= */
const CATS = [
  { k: 'pay',   t: 'תלושי שכר',   ic: '💵', period: true },
  { k: 'hours', t: 'דוחות שעות',  ic: '⏱️', period: true },
  { k: 'ins',   t: 'ביטוח בריאות', ic: '🏥', exp: true },
  { k: 'visa',  t: 'ויזה / אשרה',  ic: '🛂', exp: true },
  { k: 'pass',  t: 'דרכון',        ic: '📘', exp: true },
  { k: 'cont',  t: 'חוזה העסקה',   ic: '📝' },
  { k: 'other', t: 'אחר',          ic: '📎' }
];
const CAT = Object.fromEntries(CATS.map(c => [c.k, c]));
const FIELDS = [
  ['name', 'שם מלא (כמו בדרכון)', 'text', 'ltr'], ['nick', 'כינוי / שם בעברית', 'text'],
  ['country', 'מדינה', 'text'], ['birth', 'תאריך לידה', 'date'],
  ['phone', 'טלפון', 'tel', 'ltr'], ['start', 'תחילת עבודה', 'date'],
  ['passNo', 'מספר דרכון', 'text', 'ltr'], ['passExp', 'תוקף דרכון', 'date'],
  ['visaNo', 'מספר ויזה / אשרה', 'text', 'ltr'], ['visaExp', 'תוקף ויזה', 'date'],
  ['insCo', 'חברת ביטוח', 'text'], ['insNo', 'מספר פוליסה', 'text', 'ltr'],
  ['insExp', 'תוקף ביטוח', 'date'], ['bankName', 'בנק', 'text'],
  ['bankBranch', 'מספר סניף', 'text', 'ltr'], ['bankAcc', 'מספר חשבון', 'text', 'ltr'],
  ['bankOpen', 'תאריך פתיחת חשבון', 'date'],
  ['status', 'סטטוס', 'select'],
  ['end', 'תאריך סיום (אם עזב)', 'date'], ['notes', 'הערות', 'textarea']
];
const S = { people: {}, docs: {}, meta: {} };   // מתמלא מהענן
let view = { tab: 'list', wid: null, cat: 'pay' };

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const dmy = d => d ? d.split('-').reverse().join('/') : '';
const ym = d => { const [y, m] = d.split('-'); return m + '/' + y.slice(2); };
const daysTo = d => d ? Math.floor((new Date(d + 'T12:00') - new Date(today() + 'T12:00')) / 864e5) : null;
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const active = () => Object.values(S.people).filter(p => p.status !== 'left').sort((a, b) => (a.nick || a.name || '').localeCompare(b.nick || b.name || '', 'he'));
const allPeople = () => Object.values(S.people).sort((a, b) => (a.status === 'left') - (b.status === 'left') || (a.nick || a.name || '').localeCompare(b.nick || b.name || '', 'he'));
const label = p => p ? (p.nick || p.name || 'עובד') : '';
const since = p => (p.start || p.created || '').slice(0, 7);
const docsOf = (wid, cat) => Object.values(S.docs).filter(d => d.wid === wid && (!cat || d.cat === cat)).sort((a, b) => (b.period || b.date || '').localeCompare(a.period || a.date || ''));
function toast(t, ms) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => e.style.display = 'none', ms || 3200); }
function lastMonths(n) { const r = [], d = new Date(); d.setDate(1); for (let i = 0; i < n; i++) { d.setMonth(d.getMonth() - 1); r.push(d.toISOString().slice(0, 7)); } return r; }

function expPill(title, d) {
  if (!d) return `<span class="pill off">${title}: חסר</span>`;
  const n = daysTo(d);
  const cls = n < 0 ? 'red' : n <= 30 ? 'red' : n <= 60 ? 'org' : 'ok';
  const txt = n < 0 ? 'פג ' + dmy(d) : 'עד ' + dmy(d);
  return `<span class="pill ${cls}">${title}: ${txt}</span>`;
}

function alertsHtml() {
  const out = [];
  active().forEach(p => {
    [['visaExp', 'הוויזה'], ['insExp', 'ביטוח הבריאות'], ['passExp', 'הדרכון']].forEach(([f, t]) => {
      const n = daysTo(p[f]);
      if (n === null) return;
      if (n < 0) out.push({ c: 'red', w: p.id, s: `⛔ ${esc(label(p))} — ${t} פג בתאריך ${dmy(p[f])}` });
      else if (n <= 60) out.push({ c: n <= 30 ? 'red' : 'org', w: p.id, s: `⚠️ ${esc(label(p))} — ${t} בתוקף עד ${dmy(p[f])} (עוד ${n} ימים)` });
    });
  });
  const pm = lastMonths(1)[0];
  if (new Date().getDate() >= 15) {
    const noPay = active().filter(p => !docsOf(p.id, 'pay').some(d => d.period === pm) && since(p) <= pm);
    const noHrs = active().filter(p => !docsOf(p.id, 'hours').some(d => d.period === pm) && since(p) <= pm);
    if (noPay.length) out.push({ c: 'org', s: `💵 חסר תלוש שכר ל-${ym(pm + '-01')}: ${noPay.map(p => esc(label(p))).join(', ')}`, tab: 'month' });
    if (noHrs.length) out.push({ c: 'org', s: `⏱️ חסר דוח שעות ל-${ym(pm + '-01')}: ${noHrs.map(p => esc(label(p))).join(', ')}`, tab: 'month' });
  }
  if (!out.length && active().length) return `<div class="alerts"><div class="al ok">✅ כל המסמכים בתוקף</div></div>`;
  if (out.some(a => a.w)) out.push({ c: 'ok', s: '📄 להפקת מכתב בקשת חידוש לחברת הביטוח — לחץ כאן', fn: 'renewDialog()' });
  return `<div class="alerts">${out.map(a => `<div class="al ${a.c}" onclick="${a.fn ? a.fn : a.w ? `openWorker('${a.w}')` : `setTab('${a.tab}')`}">${a.s}</div>`).join('')}</div>`;
}

function render() {
  if (!window.Cloud || !Cloud.ready) { $('app').innerHTML = gateHtml(); return; }
  if (view.wid && S.people[view.wid]) return renderWorker();
  view.wid = null;
  const tabs = `<div class="tabs"><div class="tab ${view.tab === 'list' ? 'on' : ''}" onclick="setTab('list')">👷 עובדים</div><div class="tab ${view.tab === 'month' ? 'on' : ''}" onclick="setTab('month')">📅 מעקב חודשי</div></div>`;
  let body = '';
  if (view.tab === 'month') body = monthHtml();
  else {
    const ps = view.leftOpen ? allPeople().filter(p => p.status === 'left') : active();
    const nLeft = allPeople().filter(p => p.status === 'left').length;
    body = `<div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap"><button class="btn" onclick="editWorker()">➕ עובד חדש</button><button class="btn sec" onclick="uploadDialog()">📤 העלאת מסמך</button><button class="btn ghost" onclick="importDialog()" title="אקסל / PDF עם רשימת עובדים">📥 ייבוא רשימה</button><button class="btn ghost" onclick="renewDialog()" title="מכתב לחברת הביטוח / לגורם המטפל">📄 מכתב חידוש</button></div>` +
      (ps.length ? `<div class="grid">${ps.map(p => {
        const cnt = docsOf(p.id).length;
        return `<div class="wk" onclick="openWorker('${p.id}')" style="${p.status === 'left' ? 'opacity:.75' : ''}">
          <div class="nm">${esc(label(p))}${p.status === 'left' ? ` <span class="pill">עזב${p.end ? ' ' + dmy(p.end) : ''}</span>` : ''}</div>
          ${p.nick && p.name ? `<div class="nn">${esc(p.name)}</div>` : ''}
          <div class="pills">${p.status === 'left' ? '' : expPill('ויזה', p.visaExp) + expPill('ביטוח', p.insExp) + expPill('דרכון', p.passExp)}<span class="pill">📁 ${cnt} מסמכים</span></div>
        </div>`; }).join('')}</div>`
        : `<div class="empty">${view.leftOpen ? 'אין עובדים בארכיון' : 'עדיין אין עובדים פעילים.<br>לחץ "➕ עובד חדש" כדי להוסיף.'}</div>`)
      + (nLeft || view.leftOpen ? `<button class="btn ghost" style="width:100%;margin-top:14px" onclick="view.leftOpen=!view.leftOpen;render()">${view.leftOpen ? '→ חזרה לעובדים הפעילים' : `🗄️ ארכיון עובדים שעזבו (${nLeft})`}</button>` : '');
    if (view.leftOpen) body = `<div class="al org" style="margin-bottom:10px;cursor:default">🗄️ ארכיון עובדים שעזבו — כל הפרטים והמסמכים נשמרים כאן</div>` + body;
  }
  $('app').innerHTML = alertsHtml() + tabs + body;
}
function setTab(t) { view.tab = t; view.wid = null; render(); scrollTo(0, 0); }

function monthHtml() {
  const ms = lastMonths(6).reverse();
  const ps = active();
  if (!ps.length) return `<div class="empty">אין עובדים פעילים</div>`;
  const cell = (p, c, m) => {
    const d = docsOf(p.id, c).find(x => x.period === m);
    if (!d && since(p) > m) return `<td style="opacity:.35;cursor:pointer" title="לפני תחילת העבודה / הרישום — לחיצה להעלאה" onclick="uploadDialog('${p.id}','${c}','${m}')">·</td>`;
    return d ? `<td class="y" title="פתח" style="cursor:pointer" onclick="openDoc('${d.id}')">✓</td>` : `<td class="n" style="cursor:pointer" title="העלה" onclick="uploadDialog('${p.id}','${c}','${m}')">✗</td>`;
  };
  return ['pay', 'hours'].map(c => `<div class="box"><h3>${CAT[c].ic} ${CAT[c].t}</h3><div class="scroll"><table class="mt">
    <tr><th>עובד</th>${ms.map(m => `<th>${ym(m + '-01')}</th>`).join('')}</tr>
    ${ps.map(p => `<tr><td>${esc(label(p))}</td>${ms.map(m => cell(p, c, m)).join('')}</tr>`).join('')}
  </table></div><div class="note">✓ = יש מסמך (לחיצה פותחת) · ✗ = חסר (לחיצה להעלאה) · · = לפני תחילת העבודה או הרישום</div></div>`).join('');
}

/* ---------- ארכיון: מה נוכחי ומה ישן ---------- */
const CUR_Y = () => String(new Date().getFullYear());
const docYear = d => String(d.period || d.exp || d.docDate || d.date || '').slice(0, 4);
// ביטוח / ויזה / דרכון: נוכחי = בתוקף היום, או האחרון שהועלה. השאר לארכיון.
// תלושים / שעות / אחר: נוכחי = השנה הנוכחית. חוזה: האחרון.
function splitDocs(wid, cat) {
  const all = docsOf(wid, cat);
  const c = CAT[cat], t = today();
  let cur;
  if (c.exp) {
    const valid = all.filter(d => d.exp && d.exp >= t);
    const latest = all.filter(d => d.exp).sort((a, b) => b.exp.localeCompare(a.exp))[0];
    cur = valid.length ? valid : (latest ? [latest] : []);
    all.filter(d => !d.exp && docYear(d) === CUR_Y()).forEach(d => cur.push(d));
  } else if (cat === 'cont') cur = all.slice(0, 1);
  else cur = all.filter(d => docYear(d) >= CUR_Y());
  const ids = new Set(cur.map(d => d.id));
  return { cur, arch: all.filter(d => !ids.has(d.id)) };
}
const fmtM = m => m.slice(5, 7) + '/' + m.slice(2, 4);
function monthRanges(ms) {                     // ['2022-04','2022-05','2022-07'] → "04/22–05/22, 07/22"
  const out = []; let a = null, b = null;
  const next = m => { const d = new Date(m + '-15'); d.setMonth(d.getMonth() + 1); return d.toISOString().slice(0, 7); };
  const rg = (x, y) => '<bdi dir="ltr">' + (x === y ? fmtM(x) : fmtM(x) + '–' + fmtM(y)) + '</bdi>';
  ms.forEach(m => { if (a && next(b) === m) b = m; else { if (a) out.push(rg(a, b)); a = b = m; } });
  if (a) out.push(rg(a, b));
  return out.join(', ');
}
// בדיקת שלמות מתחילת העבודה: אילו חודשים חסרים ואילו תקופות בלי ביטוח
function completeness(p) {
  if (!p.start) return { noStart: true };
  const endM = p.status === 'left' && p.end ? p.end.slice(0, 7) : lastMonths(1)[0];
  const months = []; const d = new Date(p.start.slice(0, 7) + '-15');
  while (d.toISOString().slice(0, 7) <= endM) { months.push(d.toISOString().slice(0, 7)); d.setMonth(d.getMonth() + 1); }
  const has = cat => new Set(docsOf(p.id, cat).map(x => x.period).filter(Boolean));
  const hp = has('pay'), hh = has('hours');
  const missPay = months.filter(m => !hp.has(m)), missHrs = months.filter(m => !hh.has(m));
  // ביטוח: תקופות בלי כיסוי, מתחילת העבודה עד היום / עד העזיבה
  const endD = p.status === 'left' && p.end ? p.end : today();
  const iv = docsOf(p.id, 'ins').filter(x => x.exp).map(x => {
    let f = x.from; if (!f) { const t = new Date(x.exp + 'T12:00'); t.setFullYear(t.getFullYear() - 1); t.setDate(t.getDate() + 1); f = t.toISOString().slice(0, 10); }
    return [f, x.exp];
  }).sort((a, b) => a[0].localeCompare(b[0]));
  const gaps = []; let cur = p.start;
  const plus1 = s => { const t = new Date(s + 'T12:00'); t.setDate(t.getDate() + 1); return t.toISOString().slice(0, 10); };
  const minus1 = s => { const t = new Date(s + 'T12:00'); t.setDate(t.getDate() - 1); return t.toISOString().slice(0, 10); };
  for (const [f, e] of iv) { if (e < cur) continue; if (f > cur) gaps.push([cur, f <= endD ? minus1(f) : endD]); if (plus1(e) > cur) cur = plus1(e); if (cur > endD) break; }
  if (cur <= endD) gaps.push([cur, endD]);
  return { months: months.length, missPay, missHrs, insGaps: gaps.filter(g => g[0] < g[1] || g[0] === g[1]) };
}
function completenessHtml(p) {
  const c = completeness(p);
  if (c.noStart) return `<div class="al org" onclick="editWorker('${p.id}')">📅 חסר תאריך תחילת עבודה — הוסף אותו ב"✏️ פרטים" כדי שאוכל לבדוק אילו מסמכים חסרים</div>`;
  const line = (ok, icon, txt) => `<div class="al ${ok ? 'ok' : 'org'}" style="cursor:default">${icon} ${txt}</div>`;
  return `<div class="alerts">
    ${line(!c.missPay.length, '💵', c.missPay.length ? `חסרים ${c.missPay.length} תלושי שכר: ${monthRanges(c.missPay)}` : `כל ${c.months} תלושי השכר קיימים`)}
    ${line(!c.missHrs.length, '⏱️', c.missHrs.length ? `חסרים ${c.missHrs.length} דוחות שעות: ${monthRanges(c.missHrs)}` : `כל ${c.months} דוחות השעות קיימים`)}
    ${line(!c.insGaps.length, '🏥', c.insGaps.length ? 'תקופות בלי ביטוח במערכת: ' + c.insGaps.map(g => '<bdi dir="ltr">' + dmy(g[0]) + '–' + dmy(g[1]) + '</bdi>').join(', ') : 'יש ביטוח לכל התקופה מתחילת העבודה')}
  </div>`;
}

function renderWorker() {
  const p = S.people[view.wid];
  const arch = !!view.arch;
  const cnt = k => (arch ? splitDocs(p.id, k).arch : splitDocs(p.id, k).cur).length;
  const sp = splitDocs(p.id, view.cat);
  const c = CAT[view.cat];
  const archTotal = CATS.reduce((a, k) => a + splitDocs(p.id, k.k).arch.length, 0);
  const byYear = list => { const g = {}; list.forEach(d => (g[docYear(d) || 'ללא תאריך'] = g[docYear(d) || 'ללא תאריך'] || []).push(d)); return Object.keys(g).sort().reverse().map(y => `<div style="font-size:13px;color:var(--gold);margin:12px 0 6px;font-weight:700">${y} · ${g[y].length}</div>` + g[y].map(docRow).join('')).join(''); };
  $('app').innerHTML = `
  <div class="hd"><button class="btn ghost sm" onclick="view.wid=null;render()">→ חזרה</button>
    <div class="t"><b>${esc(label(p))}</b><span>${esc(p.name || '')}${p.country ? ' · ' + esc(p.country) : ''}${p.start ? ' · מ-' + dmy(p.start) : ''}</span></div>
    <button class="btn sec sm" onclick="editWorker('${p.id}')">✏️ פרטים</button></div>
  ${p.status === 'left' ? '<div class="alerts"><div class="al org">העובד מסומן כ"עזב"' + (p.end ? ' — ' + dmy(p.end) : '') + '</div></div>' : `<div class="pills" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">${expPill('ויזה', p.visaExp)}${expPill('ביטוח', p.insExp)}${expPill('דרכון', p.passExp)}</div>`}
  <div class="box">
    <h3>${arch ? '🗄️ ארכיון מסמכים' : '📁 תיק מסמכים — ' + CUR_Y()}<span class="grow"></span>${p.folder ? `<a class="btn ghost sm" href="https://drive.google.com/drive/folders/${p.folder}" target="_blank">פתח בדרייב</a>` : ''}</h3>
    <div style="display:flex;gap:6px;margin-bottom:10px"><button class="tab ${!arch ? 'on' : ''}" style="font-family:inherit" onclick="view.arch=false;render()">📁 נוכחי</button><button class="tab ${arch ? 'on' : ''}" style="font-family:inherit" onclick="view.arch=true;render()">🗄️ ארכיון${archTotal ? ' (' + archTotal + ')' : ''}</button></div>
    ${arch ? completenessHtml(p) : ''}
    <div class="cats">${CATS.map(k => `<button class="cat ${k.k === view.cat ? 'on' : ''}" onclick="view.cat='${k.k}';render()">${k.ic} ${k.t}<span class="n">${cnt(k.k) || ''}</span></button>`).join('')}</div>
    <button class="btn" style="width:100%;margin-bottom:10px" onclick="uploadDialog('${p.id}','${view.cat}')">📤 העלאת ${c.t}</button>${arch ? '<div class="note" style="margin:-4px 0 10px;text-align:center">אפשר לבחור כמה קבצים ישנים יחד — Claude ימיין אותם לפי שנה וחודש</div>' : ''}
    ${arch ? (sp.arch.length ? byYear(sp.arch) : `<div class="empty" style="padding:20px">אין ${c.t} ישנים בארכיון</div>`)
           : (sp.cur.length ? sp.cur.map(docRow).join('') : `<div class="empty" style="padding:20px">אין ${c.t} ל-${CUR_Y()}${sp.arch.length ? `<br><a href="#" onclick="view.arch=true;render();return false">${sp.arch.length} ישנים בארכיון ←</a>` : ''}</div>`)}
  </div>
  <div class="box"><h3>📋 פרטים</h3><div class="fg">${FIELDS.filter(f => !['notes', 'status', 'end'].includes(f[0]) && p[f[0]]).map(f => `<div><div style="font-size:11px;color:rgba(255,255,255,.5)">${f[1]}</div><div style="font-size:15px;${f[3] ? 'direction:ltr;text-align:right' : ''}">${esc(f[2] === 'date' ? dmy(p[f[0]]) : p[f[0]])}</div></div>`).join('') || '<div class="note">לחץ "✏️ פרטים" כדי למלא</div>'}</div>${p.notes ? `<div class="note" style="white-space:pre-wrap">${esc(p.notes)}</div>` : ''}</div>`;
}
function docRow(d) {
  const c = CAT[d.cat] || CAT.other;
  const sub = [d.period ? 'חודש ' + ym(d.period + '-01') : '', d.exp ? (d.from ? '<bdi dir="ltr">' + dmy(d.from) + '–' + dmy(d.exp) + '</bdi>' : 'בתוקף עד ' + dmy(d.exp)) + (d.exp < today() ? ' (פג)' : '') : '', d.date ? 'הועלה ' + dmy(d.date) : '', d.shared ? 'קובץ משותף' : ''].filter(Boolean).join(' · ');
  return `<div class="doc"><div class="ic">${c.ic}</div><div class="i"><b>${esc(d.title || d.fname || c.t)}</b><span>${sub}</span></div>
    <button class="btn sec sm" onclick="openDoc('${d.id}')">פתח</button><button class="btn ghost sm" onclick="editDoc('${d.id}')" title="תיקון סוג / עובד / תאריך">✏️</button><button class="btn ghost sm" onclick="removeDoc('${d.id}')" title="הסר מהרשימה">✕</button></div>`;
}
function openWorker(id) { view.wid = id; view.cat = 'pay'; view.arch = false; render(); scrollTo(0, 0); }
function openDoc(id) { const d = S.docs[id]; if (d && d.link) window.open(d.link, '_blank'); }
async function removeDoc(id) {
  const d = S.docs[id]; if (!d) return;
  if (!confirm(`להסיר את "${d.title || d.fname}" מהרשימה?\n\nהקובץ עצמו נשאר בדרייב ולא נמחק.`)) return;
  await Cloud.del('docs', id); toast('הוסר מהרשימה (הקובץ נשאר בדרייב)');
}

/* ---------- עריכת עובד ---------- */
function editWorker(id) {
  const p = id ? S.people[id] : { country: 'תאילנד', status: 'active' };
  $('md').innerHTML = `<h2>${id ? '✏️ פרטי עובד' : '➕ עובד חדש'}<button class="x" onclick="closeMd()">✕</button></h2>
  <div class="fg">${FIELDS.map(([k, t, ty, dir]) => {
    if (ty === 'select') return `<label class="f">${t}<select id="f_${k}"><option value="active">פעיל</option><option value="left" ${p.status === 'left' ? 'selected' : ''}>עזב</option></select></label>`;
    if (ty === 'textarea') return `<label class="f" style="grid-column:1/-1">${t}<textarea id="f_${k}" rows="3">${esc(p[k])}</textarea></label>`;
    return `<label class="f">${t}<input id="f_${k}" type="${ty}" value="${esc(p[k])}" ${dir ? 'class="ltr"' : ''}></label>`;
  }).join('')}</div>
  <div class="note">אפשר למלא רק שם ולהשלים אחר כך. כשמעלים דרכון, ויזה או ביטוח, תאריכי התוקף מתמלאים לבד.</div>
  <div class="row"><button class="btn" onclick="saveWorker('${id || ''}')">💾 שמירה</button>${id ? `<button class="btn red" onclick="deleteWorker('${id}')">מחיקה</button>` : ''}</div>`;
  openMd();
}
async function saveWorker(id) {
  const p = id ? { ...S.people[id] } : { id: uid('w'), created: today() };
  FIELDS.forEach(([k]) => { const v = $('f_' + k).value.trim(); if (v) p[k] = v; else delete p[k]; });
  if (!p.name && !p.nick) { toast('צריך לפחות שם'); return; }
  if (!p.status) p.status = 'active';
  await Cloud.put('people', p.id, p);
  closeMd(); view.wid = p.id; render(); toast('נשמר ✓');
}
async function deleteWorker(id) {
  const p = S.people[id];
  if (!confirm(`למחוק את ${label(p)} מהמערכת?\n\nעדיף לסמן "עזב" בסטטוס — כך ההיסטוריה נשמרת.\nהקבצים בדרייב לא נמחקים בכל מקרה.`)) return;
  if (prompt('כדי לאשר מחיקה הקלד: מחק') !== 'מחק') return;
  for (const d of docsOf(id)) await Cloud.del('docs', d.id);
  await Cloud.del('people', id);
  closeMd(); view.wid = null; render(); toast('נמחק');
}

/* ---------- העלאת מסמך ---------- */
let UP = null;

  if (!active().length && !wid) { toast('קודם מוסיפים עובד'); return; }
  UP = { wid: wid || '', cat: cat || (localStorage.getItem('luria_api_key') ? 'auto' : 'pay'), period: period || lastMonths(1)[0], files: [], multi: [] };
  drawUpload(); openMd();
}
function drawUpload() {
  const hasKey = !!localStorage.getItem('luria_api_key');
  if (UP.cat === 'auto' && !hasKey) UP.cat = 'pay';
  const c = CAT[UP.cat] || {};
  const ps = active();

async function impRead(file) {

    if (/\.xlsx$/i.test(file.name)) { st.innerHTML = '<span class="spin"></span> קורא אקסל…'; recs = rowsToRecords(await readXlsx(buf)); }
    else if (/\.csv$/i.test(file.name) || file.type === 'text/csv') recs = rowsToRecords(readCsv(new TextDecoder().decode(buf)));
    else {
      st.innerHTML = '<span class="spin"></span> Claude קורא את הרשימה…';
      const f = new File([buf], file.name, { type: file.type || 'application/pdf' });
      recs = await AI.readList(f);

    recs = recs.map(normRec).filter(r => r.name || r.passNo);
    if (!recs.length) throw new Error('לא נמצאו עובדים בקובץ');
    IMP.recs = recs.map(r => {
      const pn = String(r.passNo || '').replace(/\s/g, '').toUpperCase();
      let hit = pn && allPeople().find(p => String(p.passNo || '').replace(/\s/g, '').toUpperCase() === pn);
      if (!hit && r.name) { const w = r.name.toLowerCase().split(' '); hit = allPeople().find(p => { const pw = String(p.name || '').toLowerCase().split(/\s+/); return w.length > 1 && w.every(x => pw.includes(x)); }); }
      const ch = {};
      for (const [k, v] of Object.entries(r)) if (k !== 'name' && (!hit || String(hit[k] || '') !== String(v))) ch[k] = v;
      if (hit && !hit.name && r.name) ch.name = r.name;
      return { r, hit: hit ? hit.id : null, ch, on: !hit || Object.keys(ch).length > 0 };
    });
    st.innerHTML = `נמצאו ${recs.length} עובדים בקובץ:`;

}

/* ---------- פיצול PDF רב-עמודי לפי חודש / עובד ---------- */
async function loadPdfLib() {
  if (window.PDFLib) return window.PDFLib;
  const add = src => new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
  try { await add('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js'); } catch (e) { await add('https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js'); }
  if (!window.PDFLib) throw new Error('לא נטען כלי הפיצול');
  return window.PDFLib;
}
// מחזיר שורות סיכום אם פוצל, או null אם הקובץ הוא מסמך אחד
async function splitAndFile(fileObj, chosenCat, chosenWid, status, srcHash) {
  let L; try { L = await loadPdfLib(); } catch (e) { throw new Error('נטען כלי הפיצול נכשל — בדוק אינטרנט'); }
  const buf = await fileObj.arrayBuffer();
  const src = await L.PDFDocument.load(buf, { ignoreEncryption: true });
  const n = src.getPageCount();
  if (n < 2) return null;
  status(`Claude קורא ${n} עמודים…`);
  let pages; try { pages = await AI.pages(fileObj, n); } catch (e) { throw new Error('קריאת העמודים עם Claude — ' + e.message); }
  // קיבוץ עמודים רצופים לאותו מסמך (חודש + עובד + סוג)
  const groups = [];
  let brk = false;
  for (let i = 0; i < n; i++) {
    const pg = pages.find(x => +x.page === i + 1) || {};
    if (pg.docType === 'skip') { brk = true; continue; }            // עמוד שער / מפריד / גרסה מוקדמת — לא נשמר
    const prev = brk ? null : groups[groups.length - 1]; brk = false;
    const key = [pg.docType || '', pg.period || '', pg.expiry || '', String(pg.workerName || '').toLowerCase().trim()].join('|');
    const cont = prev && (pg.continued === true || String(pg.continued) === 'true' || (!pg.period && !pg.workerName && !pg.expiry) || prev.key === key);
    if (cont) prev.idx.push(i); else groups.push({ key, idx: [i], info: { ...pg } });
  }
  const skipped = n - groups.reduce((a, g) => a + g.idx.length, 0);
  if (groups.length < 2 && !skipped) return null;
  if (!groups.length) throw new Error('לא נמצאו מסמכים בקובץ');
  const out = [];
  let k = 0;
  for (const g of groups) {
    k++;
    const info = g.info;
    const r = resolveDoc(info, chosenCat, chosenWid, false);
    if (!r.cat || !r.wid) throw new Error(`עמודים ${g.idx[0] + 1}-${g.idx[g.idx.length - 1] + 1}: לא זוהה ${!r.cat ? 'סוג המסמך' : 'העובד'}`);
    const c = CAT[r.cat];
    const period = c.period && /^\d{4}-\d{2}$/.test(info.period || '') ? info.period : '';
    const exp = c.exp && /^\d{4}-\d{2}-\d{2}$/.test(info.expiry || '') ? info.expiry : '';
    const owner = S.people[r.wid];
    const title = docTitle(r.cat, period, exp);
    const dup = findDup(r.wid, r.cat, period, exp, null);
    if (dup) { out.push(`⏭️ עמ׳ ${g.idx[0] + 1}${g.idx.length > 1 ? '-' + (g.idx[g.idx.length - 1] + 1) : ''} — ${dupMsg(dup)}`); continue; }
    const fname = label(owner) + ' - ' + title.replace(/\//g, '-') + '.pdf';
    status(`שומר ${k}/${groups.length}: ${title}…`);
    const doc = await L.PDFDocument.create();
    (await doc.copyPages(src, g.idx)).forEach(pg => doc.addPage(pg));
    const part = new File([await doc.save()], fname, { type: 'application/pdf' });
    let up; try { up = await Drive.upload(part, fname, await Drive.workerFolder(owner, r.cat)); } catch (e) { throw new Error(`שמירה בדרייב (אחרי ${out.length} מסמכים) — ` + (/fetch|network/i.test(e.message) ? 'אין חיבור לגוגל דרייב' : e.message)); }
    const d = { id: uid('d'), wid: r.wid, cat: r.cat, title, fname, fileId: up.id, link: up.webViewLink || ('https://drive.google.com/file/d/' + up.id + '/view'), date: today(), pages: g.idx.length };
    if (srcHash) d.srcHash = srcHash;
    if (period) d.period = period; if (exp) d.exp = exp;
    if (exp && /^\d{4}-\d{2}-\d{2}$/.test(info.validFrom || '') && info.validFrom < exp) d.from = info.validFrom;
    if (info.hours) d.hours = info.hours; if (info.net) d.net = info.net;
    await Cloud.put('docs', d.id, d);
    await applyToWorker(r.wid, r.cat, info, exp);
    out.push(`📄 עמ׳ ${g.idx[0] + 1}${g.idx.length > 1 ? '-' + (g.idx[g.idx.length - 1] + 1) : ''} → ${c.ic} ${title} · ${esc(label(owner))}`);
  }
  if (skipped) out.push(`ℹ️ ${skipped} עמודים לא נשמרו (עמוד שער / מפריד / גרסה מוקדמת)`);
  return out;
}

/* ---------- Claude ---------- */
/* קריאה ל-Claude בזרימה (stream): הנתונים זורמים כל הזמן, כך שהחיבור לא נקטע בקבצים ארוכים */
async function claudeFetch(url, opt) {
  const body = JSON.parse(opt.body); body.stream = true;
  const go = () => fetch(url, { ...opt, body: JSON.stringify(body) });
  let r;
  try { r = await go(); } catch (e) { await new Promise(z => setTimeout(z, 2500)); try { r = await go(); } catch (e2) { throw new Error('אין חיבור ל-Claude — בדוק אינטרנט ונסה שוב'); } }
  if (!r.ok || !r.body) return r;
  const rd = r.body.getReader(), dec = new TextDecoder();
  let buf = '', text = '', stop = null, err = null;
  try {
    for (;;) {
      const { done, value } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line.startsWith('data:')) continue;
        let ev; try { ev = JSON.parse(line.slice(5)); } catch (e) { continue; }
        if (ev.type === 'content_block_delta' && ev.delta && ev.delta.type === 'text_delta') text += ev.delta.text;
        else if (ev.type === 'message_delta' && ev.delta) stop = ev.delta.stop_reason || stop;
        else if (ev.type === 'error') err = ev.error;
      }
    }
  } catch (e) { throw new Error('החיבור ל-Claude נקטע באמצע הקריאה — ודא שהמסך דולק והאינטרנט יציב, ונסה שוב'); }
  const j = err ? { error: err } : { content: [{ type: 'text', text }], stop_reason: stop };
  return { ok: !err, status: err ? (/overload/i.test(err.type || '') ? 529 : 500) : 200, json: async () => j };
}

render(); drawBar();
</script>

<script type="module">
/* ======================= ענן (Firestore) + דרייב ======================= */
const OWNER = 'lurietrogim@gmail.com';
const FB = 'https://www.gstatic.com/firebasejs/12.18.0/';
const CFG = { apiKey: 'AIzaSyDeEqKUSOUvlJadmkaJ_E9qx-BifkpnKg4', authDomain: 'luria-farm.firebaseapp.com', projectId: 'luria-farm', storageBucket: 'luria-farm.firebasestorage.app', messagingSenderId: '977449076829', appId: '1:977449076829:web:2ef92d7bdb57690066a5b4' };
const ROOT_NAME = 'עובדים זרים — לוריא';
let F, auth, db;
const isOwner = u => !!u && String(u.email || '').toLowerCase() === OWNER;

const Cloud = window.Cloud = {
  state: 'loading', ready: false, pending: 0, err: '',
  ref(col, id) { return id === undefined ? F.doc(db, 'workers', 'main') : F.doc(db, 'workers', 'main', col, id); },
  _track(pr) { this.pending++; drawBar(); pr.catch(e => { console.error(e); toast('❌ השמירה בענן נכשלה: ' + (e.code || e.message), 6000); }).finally(() => { this.pending--; drawBar(); }); return Promise.resolve(); },
  put(col, id, v) { S[col] = { ...S[col], [id]: v }; return this._track(F.setDoc(this.ref(col, id), JSON.parse(JSON.stringify(v)))); },
  del(col, id) { const o = { ...S[col] }; delete o[id]; S[col] = o; return this._track(F.deleteDoc(this.ref(col, id))); },
  async putMeta(v) { await F.setDoc(this.ref(), v, { merge: true }); },
  async signIn() {
    try { const p = new F.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account', login_hint: OWNER }); await F.signInWithPopup(auth, p); }
    catch (e) { this.err = 'ההתחברות לא הצליחה: ' + (e.code || e.message); render(); }
  }
};

function start() {
  let first = { people: false, docs: false, meta: false };
  const done = () => { if (first.people && first.docs && first.meta && !Cloud.ready) { Cloud.ready = true; Cloud.state = 'ready'; drawBar(); } render(); drawBar(); };
  const onErr = e => { console.error(e); Cloud.err = /permission/i.test(e.code || e.message) ? 'אין הרשאה לקרוא מהענן (כללי האבטחה של Firestore)' : (e.message || e.code); Cloud.state = 'out'; Cloud.ready = false; render(); drawBar(); };
  for (const col of ['people', 'docs']) {
    F.onSnapshot(F.collection(db, 'workers', 'main', col), s => {
      const o = {}; s.forEach(d => o[d.id] = d.data()); S[col] = o; first[col] = true; done();
    }, onErr);
  }
  F.onSnapshot(Cloud.ref(), s => { S.meta = s.exists() ? s.data() : {}; first.meta = true; done(); }, onErr);
}

(async () => {
  try {
    const [A, Au, Fs] = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-auth.js'), import(FB + 'firebase-firestore.js')]);
    const app = A.getApps().length ? A.getApp() : A.initializeApp(CFG);
    auth = Au.getAuth(app);
    try { db = Fs.initializeFirestore(app, { localCache: Fs.persistentLocalCache({ tabManager: Fs.persistentMultipleTabManager() }) }); } catch (e) { db = Fs.getFirestore(app); }
    F = { ...Au, ...Fs };
  } catch (e) { Cloud.state = 'out'; Cloud.err = 'אין חיבור לאינטרנט'; render(); drawBar(); return; }
  let started = false;
  F.onAuthStateChanged(auth, async u => {
    if (u && !isOwner(u)) { Cloud.err = `החשבון ${u.email} אינו מורשה. יש להתחבר עם ${OWNER}.`; await F.signOut(auth); return; }
    if (!u) { Cloud.state = 'out'; Cloud.ready = false; render(); drawBar(); return; }
    Cloud.err = '';
    if (!started) { started = true; start(); }
  });
})();

/* ---------- Google Drive ---------- */
const TOK = 'lw_drive_tok';
const Drive = window.Drive = {
  async token() {
    try { const t = JSON.parse(sessionStorage.getItem(TOK) || 'null'); if (t && t.exp > Date.now() + 60000) return t.v; } catch (e) {}
    const p = new F.GoogleAuthProvider();
    p.addScope('https://www.googleapis.com/auth/drive.file');
    p.setCustomParameters({ login_hint: OWNER });
    const cur = auth.currentUser;
    const res = cur && isOwner(cur) ? await F.reauthenticateWithPopup(cur, p) : await F.signInWithPopup(auth, p);
    if (!isOwner(res.user)) throw new Error('יש להתחבר עם ' + OWNER);
    const cred = F.GoogleAuthProvider.credentialFromResult(res);
    if (!cred || !cred.accessToken) throw new Error('לא התקבלה הרשאה לדרייב');
    sessionStorage.setItem(TOK, JSON.stringify({ v: cred.accessToken, exp: Date.now() + 50 * 60000 }));
    return cred.accessToken;
  },
  async api(url, opt = {}) {
    const t = await this.token();
    const go = () => fetch(url, { ...opt, headers: { ...(opt.headers || {}), Authorization: 'Bearer ' + t } });
    let r; try { r = await go(); } catch (e) { await new Promise(z => setTimeout(z, 1500)); r = await go(); }
    if (r.status === 401) { sessionStorage.removeItem(TOK); throw new Error('ההרשאה לדרייב פגה — נסה שוב'); }
    if (!r.ok) throw new Error('דרייב ' + r.status + ': ' + (await r.text()).slice(0, 160));
    return r.json();
  },
  async exists(id) {
    if (!id) return false;
    try { const f = await this.api(`https://www.googleapis.com/drive/v3/files/${id}?fields=id,trashed`); return !f.trashed; } catch (e) { return false; }
  },
  async mkdir(name, parent) {
    return (await this.api('https://www.googleapis.com/drive/v3/files?fields=id', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, mimeType: 'application/vnd.google-apps.folder', ...(parent ? { parents: [parent] } : {}) }) })).id;
  },
  async child(parent, name) {
    const q = encodeURIComponent(`'${parent}' in parents and name='${name.replace(/'/g, "\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
    const r = await this.api(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`);
    return (r.files && r.files[0] && r.files[0].id) || await this.mkdir(name, parent);
  },
  async root() {
    if (await this.exists(S.meta.rootFolder)) return S.meta.rootFolder;
    const id = await this.mkdir(ROOT_NAME);
    S.meta.rootFolder = id; await Cloud.putMeta({ rootFolder: id });
    return id;
  },
  async workerFolder(p, cat) {
    let wf = p.folder;
    if (!(await this.exists(wf))) {
      wf = await this.child(await this.root(), label(p) + (p.name && p.nick ? ' — ' + p.name : ''));
      await Cloud.put('people', p.id, { ...S.people[p.id], folder: wf });
    }
    return this.child(wf, CAT[cat].t);
  },
  async download(id, name) {
    const t = await this.token();
    const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, { headers: { Authorization: 'Bearer ' + t } });
    if (r.status === 401) { sessionStorage.removeItem(TOK); throw new Error('ההרשאה לדרייב פגה — נסה שוב'); }
    if (!r.ok) throw new Error('הורדה מהדרייב נכשלה: ' + r.status);
    const b = await r.blob();
    return new File([b], name, { type: b.type || (/\.pdf$/i.test(name) ? 'application/pdf' : 'image/jpeg') });
  },
  async move(id, folder, name) {
    const f = await this.api(`https://www.googleapis.com/drive/v3/files/${id}?fields=parents`);
    const rm = (f.parents || []).filter(x => x !== folder).join(',');
    await this.api(`https://www.googleapis.com/drive/v3/files/${id}?addParents=${folder}${rm ? '&removeParents=' + rm : ''}&fields=id`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(name ? { name } : {}) });
  },
  async sharedFolder(cat) { return this.child(await this.child(await this.root(), 'מסמכים משותפים'), CAT[cat].t); },
  async upload(file, name, parent) {
    const t = await this.token();
    const meta = { name, parents: [parent] };
    const fd = new FormData();
    fd.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
    fd.append('file', file);
    const go = () => fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink,name', { method: 'POST', headers: { Authorization: 'Bearer ' + t }, body: fd });
    let r; try { r = await go(); } catch (e) { await new Promise(z => setTimeout(z, 2000)); r = await go(); }
    if (r.status === 401) { sessionStorage.removeItem(TOK); throw new Error('ההרשאה לדרייב פגה — נסה שוב'); }
    if (!r.ok) throw new Error('העלאה לדרייב נכשלה: ' + r.status);
    return r.json();
  }
};
render(); drawBar();
</script>
