<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<!-- 🔒 קוד PIN לכל מערכות לוריא — אותו קוד בכל הדפים (נובמבר 2026) -->
<style id="lf-lock-css">
html.lf-locked body{display:none!important}
#lf-lock{position:fixed;inset:0;z-index:2147483647;background:#14201a;color:#f3ead2;display:flex;align-items:center;justify-content:center;font-family:Heebo,Arial,sans-serif;direction:rtl}
#lf-lock .bx{width:min(340px,88vw);text-align:center}
#lf-lock h2{margin:0 0 6px;font-size:22px;color:#e2c46b}
#lf-lock p{margin:0 0 18px;font-size:14px;opacity:.85;line-height:1.5}
#lf-lock input{width:100%;box-sizing:border-box;font-size:28px;letter-spacing:10px;text-align:center;padding:12px;border-radius:12px;border:1px solid #6b5a2a;background:#0d1611;color:#fff;direction:ltr}
#lf-lock button{margin-top:12px;width:100%;padding:12px;border-radius:12px;border:1px solid #e2c46b;background:#e2c46b;color:#14201a;font-size:16px;font-weight:700;cursor:pointer}
#lf-lock button.ln{background:none;color:#cbbf9a;border:none;font-weight:400;font-size:13px;text-decoration:underline;margin-top:16px}
#lf-lock .er{min-height:20px;margin-top:10px;font-size:14px;color:#ff8a80}
@media print{#lf-lockbtn,#lf-lock{display:none!important}}
#lf-lockbtn{position:fixed;bottom:14px;right:14px;z-index:2147483646;width:38px;height:38px;border-radius:50%;border:1px solid rgba(226,196,107,.5);background:rgba(20,32,26,.75);color:#e2c46b;font-size:17px;cursor:pointer;opacity:.7}
</style>
<script>
(function () {
  var K_PIN = 'luria_pin_v1', K_ACT = 'luria_pin_active', K_FAIL = 'luria_pin_fail';
  var IDLE = 15 * 60 * 1000;             // ננעל אחרי 15 דקות בלי שימוש
  var OWNER = 'lurietrogim@gmail.com';
  var html = document.documentElement, box = null, lastW = 0;
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  function pin() { try { return JSON.parse(ls(K_PIN) || 'null'); } catch (e) { return null; } }
  function fresh() { return Date.now() - (+ls(K_ACT) || 0) < IDLE; }
  function touch() { var n = Date.now(); if (n - lastW > 20000 && !html.classList.contains('lf-locked')) { lastW = n; ls(K_ACT, String(n)); } }
  function b64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
  function unb64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function hashPin(code, salt, it) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveBits']).then(function (k) {
      return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: salt, iterations: it }, k, 256);
    }).then(b64);
  }
  function show(mode) {
    html.classList.add('lf-locked');
    if (!box) { box = document.createElement('div'); box.id = 'lf-lock'; html.appendChild(box); }
    var p = pin();
    if (mode === 'setup' || !p) {
      box.innerHTML = '<div class="bx"><h2>🔒 קוד כניסה למערכות לוריא</h2><p>בחר קוד של 4 עד 6 ספרות.<br>הקוד ישמש את כל המערכות במכשיר הזה.</p>' +
        '<input id="lf-a" type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="קוד חדש">' +
        '<input id="lf-b" type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="שוב, לאימות" style="margin-top:10px">' +
        '<button id="lf-ok">שמור קוד</button><div class="er" id="lf-er"></div></div>';
      var a = box.querySelector('#lf-a'), b2 = box.querySelector('#lf-b');
      setTimeout(function () { a.focus(); }, 50);
      box.querySelector('#lf-ok').onclick = function () {
        var x = a.value.trim(), y = b2.value.trim(), er = box.querySelector('#lf-er');
        if (!/^\d{4,6}$/.test(x)) { er.textContent = 'הקוד צריך להיות 4 עד 6 ספרות'; return; }
        if (x !== y) { er.textContent = 'שני הקודים לא זהים'; b2.value = ''; b2.focus(); return; }
        var salt = crypto.getRandomValues(new Uint8Array(16)), it = 150000;
        hashPin(x, salt, it).then(function (h) {
          ls(K_PIN, JSON.stringify({ s: b64(salt), h: h, i: it, l: x.length })); ls(K_FAIL, null); unlock();
        });
      };
      return;
    }
    box.innerHTML = '<div class="bx"><h2>🔒 מערכות לוריא</h2><p>הקש את הקוד</p>' +
      '<input id="lf-in" type="password" inputmode="numeric" autocomplete="off" maxlength="6">' +
      '<button id="lf-ok">כניסה</button><div class="er" id="lf-er"></div>' +
      '<button class="ln" id="lf-forgot">שכחתי את הקוד</button></div>';
    var inp = box.querySelector('#lf-in'), er = box.querySelector('#lf-er');
    setTimeout(function () { inp.focus(); }, 50);
    function wait() { var f = {}; try { f = JSON.parse(ls(K_FAIL) || '{}'); } catch (e) {} return Math.max(0, (f.until || 0) - Date.now()); }
    function check() {
      var w = wait(); if (w) { er.textContent = 'יותר מדי ניסיונות — נסה שוב בעוד ' + Math.ceil(w / 1000) + ' שניות'; return; }
      var code = inp.value.trim(); if (!code) return;
      hashPin(code, unb64(p.s), p.i).then(function (h) {
        if (h === p.h) { ls(K_FAIL, null); unlock(); return; }
        var f = {}; try { f = JSON.parse(ls(K_FAIL) || '{}'); } catch (e) {}
        f.n = (f.n || 0) + 1;
        if (f.n >= 5) f.until = Date.now() + Math.min(3600000, 30000 * Math.pow(2, f.n - 5));
        ls(K_FAIL, JSON.stringify(f));
        inp.value = ''; er.textContent = f.until && f.until > Date.now() ? 'קוד שגוי. ננעל ל-' + Math.ceil((f.until - Date.now()) / 1000) + ' שניות' : 'קוד שגוי';
      });
    }
    box.querySelector('#lf-ok').onclick = check;
    inp.onkeydown = function (e) { if (e.key === 'Enter') check(); };
    inp.oninput = function () { if (p.l && inp.value.length === p.l) check(); };
    box.querySelector('#lf-forgot').onclick = function () { forgot(er); };
  }
  function forgot(er) {
    er.style.color = '#cbbf9a'; er.textContent = 'נפתח חלון של גוגל — התחבר עם ' + OWNER;
    var base = 'https://www.gstatic.com/firebasejs/12.18.0/';
    Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js')]).then(function (m) {
      var A = m[0], Au = m[1];
      var app = A.getApps().length ? A.getApp() : A.initializeApp({ apiKey: 'AIzaSyDeEqKUSOUvlJadmkaJ_E9qx-BifkpnKg4', authDomain: 'luria-farm.firebaseapp.com', projectId: 'luria-farm', appId: '1:977449076829:web:2ef92d7bdb57690066a5b4' });
      var pr = new Au.GoogleAuthProvider(); pr.setCustomParameters({ prompt: 'select_account', login_hint: OWNER });
      return Au.signInWithPopup(Au.getAuth(app), pr);
    }).then(function (r) {
      if (String(r.user.email || '').toLowerCase() !== OWNER) { er.style.color = ''; er.textContent = 'רק החשבון ' + OWNER + ' יכול לאפס את הקוד'; return; }
      ls(K_PIN, null); ls(K_FAIL, null); show('setup');
    }).catch(function (e) { er.style.color = ''; er.textContent = 'האיפוס לא הצליח: ' + (e && (e.code || e.message) || e); });
  }
  function unlock() {
    ls(K_ACT, String(Date.now())); lastW = Date.now();
    html.classList.remove('lf-locked');
    if (box) { box.remove(); box = null; }
  }
  window.luriaLock = function () { ls(K_ACT, '0'); show(); };
  window.luriaChangePin = function () { show('setup'); };
  if (!pin() || !fresh()) show(); else touch();
  ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(function (ev) { addEventListener(ev, touch, { passive: true, capture: true }); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && pin() && !fresh()) show(); });
  setInterval(function () { if (pin() && !fresh() && !html.classList.contains('lf-locked')) show(); }, 30000);
  addEventListener('storage', function (e) { if (e.key === K_PIN && !e.newValue) show('setup'); });
  document.addEventListener('DOMContentLoaded', function () {
    var b = document.createElement('button'); b.id = 'lf-lockbtn'; b.title = 'נעילה'; b.textContent = '🔒';
    b.onclick = function () {
      if (confirm('🔒 לנעול את המערכות עכשיו?')) { window.luriaLock(); return; }
      if (confirm('לשנות את קוד הכניסה?')) window.luriaChangePin();
    };
    document.body.appendChild(b);
  });
})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>מעקב חובות לקוחות | אתרוגי לוריא</title>
<meta name="theme-color" content="#0f2118">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --deep: #0f2118;
  --forest: #1a3d2b;
  --mid: #2d6a4f;
  --light: #52b788;
  --pale: #d8f3dc;
  --gold: #c9a84c;
  --gold-light: #f5e6c3;
  --cream: #faf7f0;
  --white: #ffffff;
  --danger: #e07a5f;
  --danger-bg: rgba(224,122,95,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Heebo', sans-serif;
  background: var(--deep);
  color: var(--white);
  min-height: 100vh;
  direction: rtl;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 0%, rgba(45,106,79,0.22) 0%, transparent 60%),
    radial-gradient(ellipse 60% 60% at 100% 100%, rgba(201,168,76,0.1) 0%, transparent 55%);
  pointer-events: none;
  z-index: 0;
}
.wrap { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }

/* Header */
.top { text-align: center; padding: 18px 0 22px; }
.top-title {
  font-family: 'Frank Ruhl Libre', serif;
  font-weight: 900;
  font-size: clamp(24px, 6vw, 30px);
  background: linear-gradient(135deg, #f5e6c3 0%, #c9a84c 45%, #f5e6c3 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.top-sub { font-size: 11px; letter-spacing: 2px; color: rgba(255,255,255,0.4); margin-top: 4px; text-transform: uppercase; }

/* Summary strip */
.summary-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}
.summary-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 14px 10px;
  text-align: center;
}
.summary-num { font-family: 'Frank Ruhl Libre', serif; font-size: 20px; font-weight: 700; }
.summary-num.owe { color: var(--danger); }
.summary-num.paid { color: var(--light); }
.summary-label { font-size: 10px; color: rgba(255,255,255,0.45); margin-top: 4px; }

/* Search + add */
.controls { display: flex; gap: 10px; margin-bottom: 16px; }
.search-input {
  flex: 1;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 12px 14px;
  color: var(--white);
  font-family: 'Heebo', sans-serif;
  font-size: 14px;
}
.search-input::placeholder { color: rgba(255,255,255,0.35); }
.btn {
  border: none;
  border-radius: 12px;
  padding: 12px 18px;
  font-family: 'Heebo', sans-serif;
  font-weight: 500;
  font-size: 14px;
  cursor: pointer;
  transition: transform 0.15s ease, opacity 0.15s ease;
}
.btn:active { transform: scale(0.97); }
.btn-gold { background: linear-gradient(135deg, var(--gold-light), var(--gold)); color: var(--deep); }
.btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--white); }
.btn-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(224,122,95,0.3); }
.btn-full { width: 100%; }
.btn-sm { padding: 8px 12px; font-size: 12px; }

/* Client cards */
.client-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 16px;
  padding: 16px 18px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: border-color 0.2s ease, transform 0.2s ease;
}
.client-card:hover { border-color: rgba(201,168,76,0.4); transform: translateY(-2px); }
.client-card.clear { opacity: 0.7; }
.client-row { display: flex; justify-content: space-between; align-items: center; }
.client-name { font-family: 'Frank Ruhl Libre', serif; font-size: 17px; font-weight: 700; }
.client-phone { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 2px; }
.client-balance { font-family: 'Frank Ruhl Libre', serif; font-size: 18px; font-weight: 700; }
.client-balance.owe { color: var(--danger); }
.client-balance.clear { color: var(--light); }
.client-meta { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 6px; }

.empty-state {
  text-align: center;
  padding: 50px 20px;
  color: rgba(255,255,255,0.35);
  font-size: 14px;
}

/* Modal */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  z-index: 50; display: none; align-items: flex-end; justify-content: center;
  backdrop-filter: blur(2px);
}
.overlay.open { display: flex; }
.modal {
  background: var(--forest);
  border: 1px solid rgba(201,168,76,0.2);
  border-radius: 22px 22px 0 0;
  width: 100%; max-width: 760px;
  max-height: 92vh; overflow-y: auto;
  padding: 20px 18px 28px;
  animation: slideUp 0.25s ease both;
}
@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-title { font-family: 'Frank Ruhl Libre', serif; font-size: 19px; font-weight: 700; }
.modal-close { background: rgba(255,255,255,0.08); border: none; color: var(--white); width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer; }

.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: rgba(255,255,255,0.55); margin-bottom: 5px; }
.field input, .field textarea, .field select {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  padding: 11px 12px;
  color: var(--white);
  font-family: 'Heebo', sans-serif;
  font-size: 14px;
}
.field textarea { resize: vertical; min-height: 50px; }

.tabs { display: flex; gap: 8px; margin: 14px 0; }
.tab-btn {
  flex: 1; padding: 9px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12);
  background: transparent; color: rgba(255,255,255,0.6); font-family: 'Heebo'; font-size: 13px; cursor: pointer;
}
.tab-btn.active { background: rgba(201,168,76,0.15); border-color: rgba(201,168,76,0.4); color: var(--gold-light); }

/* Detail balance box */
.balance-box {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
  background: rgba(255,255,255,0.03); border-radius: 14px; padding: 14px; margin-bottom: 16px;
}
.balance-item { text-align: center; }
.balance-item .n { font-family: 'Frank Ruhl Libre', serif; font-size: 17px; font-weight: 700; }
.balance-item .l { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 3px; }

/* Entries list */
.entry-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 11px 4px; border-bottom: 1px solid rgba(255,255,255,0.06);
  font-size: 13px;
}
.entry-left { display: flex; flex-direction: column; gap: 2px; }
.entry-desc { font-weight: 500; }
.entry-date { font-size: 11px; color: rgba(255,255,255,0.4); }
.entry-amt { font-family: 'Frank Ruhl Libre', serif; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.entry-amt.debt { color: var(--danger); }
.entry-amt.payment { color: var(--light); }
.entry-amt.credit { color: var(--gold-light); }
.entry-del { background: none; border: none; color: rgba(255,255,255,0.3); cursor: pointer; font-size: 15px; padding: 2px 6px; }
.entry-move { display: flex; flex-direction: column; gap: 1px; margin-left: 2px; }
.entry-move-btn { background: none; border: none; color: rgba(255,255,255,0.35); cursor: pointer; font-size: 10px; line-height: 1; padding: 2px 5px; }
.entry-move-btn:disabled { opacity: 0.15; cursor: default; }
.entry-move-btn:not(:disabled):active { color: var(--gold-light); }

.section-title { font-size: 12px; letter-spacing: 1px; color: rgba(255,255,255,0.4); text-transform: uppercase; margin: 18px 0 8px; }

/* Product mode */
.mode-toggle-row { display: flex; justify-content: flex-end; margin-bottom: 10px; }
.product-line {
  display: grid;
  grid-template-columns: 1fr 52px 78px 70px 28px;
  gap: 6px;
  align-items: center;
  margin-bottom: 8px;
}
.product-line select, .product-line input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px;
  padding: 8px 6px;
  color: var(--white);
  font-family: 'Heebo', sans-serif;
  font-size: 12px;
}
.pl-name-custom { grid-column: 1 / -1; margin-top: -4px; }
.pl-orig-row { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 11px; color: rgba(255,255,255,0.5); margin-top: -4px; }
.pl-orig-row input { width: 100px; flex: none; }
.pl-disc { color: var(--gold-light); font-weight: 700; }
.pl-subtotal { font-family: 'Frank Ruhl Libre', serif; font-size: 12px; font-weight: 700; color: var(--gold-light); text-align: center; }
.pl-del { background: none; border: none; color: rgba(255,255,255,0.35); cursor: pointer; font-size: 15px; }
.product-total-row {
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(255,255,255,0.03); border-radius: 10px; padding: 10px 12px; margin: 6px 0 16px;
  font-size: 13px; color: rgba(255,255,255,0.6);
}
.product-total-row .n { font-family: 'Frank Ruhl Libre', serif; font-weight: 700; color: var(--gold-light); font-size: 15px; }

/* Product catalog list */
.catalog-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 4px; border-bottom: 1px solid rgba(255,255,255,0.06);
}
.catalog-row input { width: 90px; text-align: center; }

.input-inline {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  padding: 11px 12px;
  color: var(--white);
  font-family: 'Heebo', sans-serif;
  font-size: 14px;
}
.input-inline::placeholder { color: rgba(255,255,255,0.35); }

.fab {
  position: fixed; bottom: 22px; left: 22px; z-index: 40;
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  color: var(--deep); border: none; font-size: 26px; cursor: pointer;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}

/* PDF print template (offscreen) */
#pdf-render {
  position: fixed; top: -9999px; left: -9999px;
  width: 700px; background: #ffffff; color: #16281f;
  font-family: 'Heebo', sans-serif; padding: 40px;
}
#pdf-render .p-head { display:flex; justify-content:space-between; align-items:flex-start; border-bottom: 3px solid #c9a84c; padding-bottom: 16px; margin-bottom: 20px; }
#pdf-render .p-co { font-family: 'Frank Ruhl Libre', serif; font-weight: 900; font-size: 22px; color: #1a3d2b; }
#pdf-render .p-co-sub { font-size: 11px; color: #666; margin-top: 3px; }
#pdf-render .p-doc-title { font-size: 13px; color: #c9a84c; font-weight: 700; text-align: left; }
#pdf-render .p-doc-date { font-size: 11px; color: #888; text-align: left; margin-top: 3px; }
#pdf-render .p-client { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
#pdf-render .p-client-sub { font-size: 12px; color: #777; margin-bottom: 18px; }
#pdf-render .p-summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 22px; }
#pdf-render .p-sbox { background: #f6f4ee; border-radius: 10px; padding: 12px; text-align: center; }
#pdf-render .p-sbox .n { font-family: 'Frank Ruhl Libre', serif; font-size: 18px; font-weight: 700; }
#pdf-render .p-sbox .l { font-size: 10px; color: #888; margin-top: 3px; }

#pdf-render th { text-align: right; background: #1a3d2b; color: #fff; padding: 9px 10px; font-weight: 500; }

<script>
const K = 'ldebts1';
let state = load();
let currentClientId = null;

function load(){
  let s;
  try { s = JSON.parse(localStorage.getItem(K)) || { clients: [], entries: [] }; }
  catch(e){ s = { clients: [], entries: [] }; }
  return normalizeState(s);
}
function normalizeState(s){
  if(!s || typeof s !== 'object') s = {};
  if(!s.clients) s.clients = [];
  if(!s.products) s.products = [];
  if(!s.clientPrices) s.clientPrices = {}; // { clientId: { productId: lastAgreedPrice } }
  if(!s.entries) s.entries = [];
  // Give every entry a stable manual-order number, so rows can be reordered within the same date.
  s.entries.forEach((e, i) => { if(e.order === undefined) e.order = i; });
  if(s.seq === undefined) s.seq = s.entries.length;
  return s;
}
function clientEntriesSorted(id){
  // Manual order is the sole sort key, so the client can freely arrange rows top-to-bottom.
  return clientEntries(id).slice().sort((a,b) => (a.order||0) - (b.order||0));
}
function moveEntryUp(id){
  const list = clientEntriesSorted(currentClientId).reverse();
  const i = list.findIndex(e => e.id === id);
  if(i <= 0) return;
  const a = list[i], b = list[i-1];
  const tmp = a.order; a.order = b.order; b.order = tmp;
  save(); renderDetail();
}
function moveEntryDown(id){
  const list = clientEntriesSorted(currentClientId).reverse();
  const i = list.findIndex(e => e.id === id);
  if(i === -1 || i >= list.length-1) return;
  const a = list[i], b = list[i+1];
  const tmp = a.order; a.order = b.order; b.order = tmp;
  save(); renderDetail();
}
function getClientPrice(clientId, productId){
  return (state.clientPrices[clientId] && state.clientPrices[clientId][productId] !== undefined)
    ? state.clientPrices[clientId][productId] : null;
}
function setClientPrice(clientId, productId, price){
  if(!state.clientPrices[clientId]) state.clientPrices[clientId] = {};
  state.clientPrices[clientId][productId] = price;
}
function save(){
  localStorage.setItem(K, JSON.stringify(state));
  if(window.cloudPush) window.cloudPush();
}
// Bridge for the cloud module: read the state, or replace it with a copy that came from the cloud.
window.__debts = {
  get: () => state,
  set: (s) => {
    state = normalizeState(s);
    localStorage.setItem(K, JSON.stringify(state));
    renderAll();
    if(document.getElementById('overlay-detail').classList.contains('open')){
      const c = state.clients.find(x => x.id === currentClientId);
      if(c){ document.getElementById('dt-name').textContent = c.name; document.getElementById('dt-phone').textContent = c.phone || ''; renderDetail(); }
      else closeModal('overlay-detail');
    }
    if(document.getElementById('overlay-catalog').classList.contains('open')) renderCatalog();
  }
};
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

const CURRENCIES = [
  { code: 'ILS', symbol: '₪', label: '₪ שקל' },
  { code: 'USD', symbol: '$', label: '$ דולר' },
  { code: 'EUR', symbol: '€', label: '€ יורו' }
];
function currencyInfo(code){ return CURRENCIES.find(c => c.code === code) || CURRENCIES[0]; }
function fmt(n, code){
  const symbol = currencyInfo(code || 'ILS').symbol;
  return symbol + Number(n||0).toLocaleString('he-IL', {minimumFractionDigits:0, maximumFractionDigits:2});
}
function today(){ return new Date().toISOString().slice(0,10); }
function heDate(d){
  if(!d) return '';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;
}

function clientEntries(id){ return state.entries.filter(e => e.clientId === id); }
// Returns totals PER CURRENCY, since amounts in different currencies must never be summed together.
// e.g. { ILS: {debt, paid, balance}, USD: {debt, paid, balance} } — only currencies actually used are included.
function clientTotalsByCurrency(id){
  const es = clientEntries(id);
  const map = {};
  es.forEach(e => {
    const code = e.currency || 'ILS';
    if(!map[code]) map[code] = { debt: 0, paid: 0, credit: 0, origDebt: 0 };
    if(e.type === 'debt'){ map[code].debt += Number(e.amount); map[code].origDebt += entryOrig(e); }
    else if(e.type === 'credit') map[code].credit += Number(e.amount);
    else map[code].paid += Number(e.amount);
  });
  Object.keys(map).forEach(code => { map[code].balance = map[code].debt - map[code].paid - map[code].credit; });
  return map;
}

function entryOrig(e){ return (e.type === 'debt' && e.origAmount != null) ? Number(e.origAmount) : Number(e.amount); }
function entryOrigUnit(e){ return e.origPrice != null ? e.origPrice : e.unitPrice; }
function isDisc(e){ return e.type === 'debt' && entryOrig(e) - Number(e.amount) > 1e-9; }

function entryLabel(e){
  if(e.type === 'debt') return 'חוב';
  if(e.type === 'credit') return 'זיכוי';
  return 'תשלום';
}

function renderAll(){
  renderSummary();
  renderClientList();
}

function formatByCurrency(map){
  const parts = CURRENCIES.filter(cur => map[cur.code]).map(cur => fmt(map[cur.code], cur.code));
  return parts.length ? parts.join('<br>') : fmt(0);
}

function renderSummary(){
  const oweByCur = {}, paidByCur = {};
  let withDebt = 0;
  state.clients.forEach(c => {
    const totals = clientTotalsByCurrency(c.id);
    let owesSomething = false;
    Object.keys(totals).forEach(code => {
      oweByCur[code] = (oweByCur[code] || 0) + Math.max(totals[code].balance, 0);
      paidByCur[code] = (paidByCur[code] || 0) + totals[code].paid;
      if(totals[code].balance > 0) owesSomething = true;
    });
    if(owesSomething) withDebt++;
  });
  document.getElementById('sum-owe').innerHTML = formatByCurrency(oweByCur);
  document.getElementById('sum-paid').innerHTML = formatByCurrency(paidByCur);
  document.getElementById('sum-count').textContent = withDebt;
}

function renderClientList(){
  const q = (document.getElementById('search').value || '').trim().toLowerCase();
  const list = document.getElementById('client-list');
  let clients = state.clients.map(c => ({ ...c, totals: clientTotalsByCurrency(c.id) }));
  if(q) clients = clients.filter(c => c.name.toLowerCase().includes(q));
  // Sort order only (mixing currencies numerically isn't a real total, just a rough ranking)
  clients.sort((a,b) => {
    const scoreOf = t => Object.values(t).reduce((s,v)=>s+v.balance,0);
    return scoreOf(b.totals) - scoreOf(a.totals);
  });

  if(clients.length === 0){
    list.innerHTML = `<div class="empty-state">אין עדיין לקוחות רשומים.<br>לחץ על "+ לקוח" כדי להתחיל.</div>`;
    return;
  }

  list.innerHTML = clients.map(c => {
    const owedParts = CURRENCIES.filter(cur => c.totals[cur.code] && c.totals[cur.code].balance > 0)
      .map(cur => fmt(c.totals[cur.code].balance, cur.code));
    const isClear = owedParts.length === 0;
    const metaParts = CURRENCIES.filter(cur => c.totals[cur.code])
      .map(cur => `${cur.symbol} חוב ${fmt(c.totals[cur.code].debt, cur.code)} · שולם ${fmt(c.totals[cur.code].paid, cur.code)}`);
    return `
    <div class="client-card ${isClear?'clear':''}" onclick="openDetail('${c.id}')">
      <div class="client-row">
        <div>
          <div class="client-name">${escapeHtml(c.name)}</div>
          ${c.phone ? `<div class="client-phone">${escapeHtml(c.phone)}</div>` : ''}
        </div>
        <div class="client-balance ${isClear?'clear':'owe'}">${isClear ? '✓ סגור' : owedParts.join(' · ')}</div>
      </div>
      <div class="client-meta">${clientEntries(c.id).length} רשומות${metaParts.length ? ' · ' + metaParts.join(' · ') : ''}</div>
    </div>`;
  }).join('');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* Modals */
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

const contactPickerSupported = ('contacts' in navigator && 'ContactsManager' in window);

function openNewClient(){
  document.getElementById('nc-name').value = '';
  document.getElementById('nc-phone').value = '';
  document.getElementById('nc-note').value = '';
  document.getElementById('pick-contact-btn').style.display = contactPickerSupported ? 'block' : 'none';
  openModal('overlay-new');
}

async function pickContact(){
  try {
    const props = ['name', 'tel'];
    const opts = { multiple: false };
    const contacts = await navigator.contacts.select(props, opts);
    if(!contacts.length) return;
    const c = contacts[0];
    const name = (c.name && c.name[0]) || '';
    const tel = (c.tel && c.tel[0]) || '';
    if(name) document.getElementById('nc-name').value = name;
    if(tel) document.getElementById('nc-phone').value = tel.replace(/\s/g, '');
  } catch(err){
    // המשתמש ביטל את הבחירה, או שהדפדפן חסם - אין צורך בהודעת שגיאה
    console.log('Contact pick cancelled or failed:', err);
  }
}
function saveNewClient(){
  const name = document.getElementById('nc-name').value.trim();
  if(!name){ alert('נא להזין שם לקוח'); return; }
  const c = { id: uid(), name, phone: document.getElementById('nc-phone').value.trim(), note: document.getElementById('nc-note').value.trim(), createdAt: today() };
  state.clients.push(c);
  save();
  closeModal('overlay-new');
  renderAll();
}

function openDetail(id){
  currentClientId = id;
  const c = state.clients.find(x => x.id === id);
  if(!c) return;
  document.getElementById('dt-name').textContent = c.name;
  document.getElementById('dt-phone').textContent = c.phone || '';
  document.getElementById('nd-date').value = today();
  document.getElementById('np-date').value = today();
  document.getElementById('nd-amount').value = '';
  document.getElementById('nd-desc').value = '';
  document.getElementById('nd-shipment').value = '';
  document.getElementById('nd-orig').value = '';
  document.getElementById('nd-currency').value = 'ILS';
  document.getElementById('np-amount').value = '';
  document.getElementById('np-desc').value = '';
  document.getElementById('np-currency').value = 'ILS';
  document.getElementById('nc-date').value = today();
  document.getElementById('nc-amount').value = '';
  document.getElementById('nc-desc').value = '';
  document.getElementById('nc-currency').value = 'ILS';
  isProductMode = false;
  document.getElementById('debt-simple-fields').style.display = 'block';
  document.getElementById('debt-product-fields').style.display = 'none';
  document.getElementById('debt-mode-btn').textContent = '🧮 מילוי לפי מוצר';
  document.getElementById('product-lines').innerHTML = '';
  addProductLine('debt');
  isCreditProductMode = false;
  document.getElementById('credit-simple-fields').style.display = 'block';
  document.getElementById('credit-product-fields').style.display = 'none';
  document.getElementById('credit-mode-btn').textContent = '🧮 מילוי לפי מוצר';
  document.getElementById('credit-product-lines').innerHTML = '';
  addProductLine('credit');
  switchTab('debt');
  renderDetail();

function renderDetail(){
  if(!currentClientId) return;
  const totals = clientTotalsByCurrency(currentClientId);
  const usedCurrencies = CURRENCIES.filter(cur => totals[cur.code]);
  const boxesEl = document.getElementById('balance-boxes');

  if(usedCurrencies.length === 0){
    boxesEl.innerHTML = `
      <div class="balance-box">
        <div class="balance-item"><div class="n" style="color:var(--danger)">${fmt(0)}</div><div class="l">חוב מקורי</div></div>
        <div class="balance-item"><div class="n" style="color:var(--light)">${fmt(0)}</div><div class="l">שולם</div></div>
        <div class="balance-item"><div class="n">${fmt(0)}</div><div class="l">יתרה</div></div>
      </div>`;
  } else {
    boxesEl.innerHTML = usedCurrencies.map((cur, i) => {
      const t = totals[cur.code];
      const balColor = t.balance > 0 ? 'var(--danger)' : 'var(--light)';
      const hasCredit = t.credit > 0;
      return `
      ${usedCurrencies.length > 1 ? `<div style="font-size:11px;color:rgba(255,255,255,0.45);margin:${i>0?'12px':'0'} 0 5px 2px">${cur.label}</div>` : ''}
      <div class="balance-box" ${hasCredit ? 'style="grid-template-columns:1fr 1fr 1fr 1fr;"' : ''}>
        <div class="balance-item"><div class="n" style="color:var(--danger)">${fmt(t.debt, cur.code)}</div><div class="l">${t.origDebt - t.debt > 1e-9 ? 'חוב אחרי הנחה' : 'חוב מקורי'}</div></div>
        <div class="balance-item"><div class="n" style="color:var(--light)">${fmt(t.paid, cur.code)}</div><div class="l">שולם</div></div>
        ${hasCredit ? `<div class="balance-item"><div class="n" style="color:var(--gold-light)">${fmt(t.credit, cur.code)}</div><div class="l">זיכויים</div></div>` : ''}
        <div class="balance-item"><div class="n" style="color:${balColor}">${fmt(t.balance, cur.code)}</div><div class="l">יתרה</div></div>
      </div>`;
    }).join('');
  }

  const entries = clientEntriesSorted(currentClientId);
  const list = document.getElementById('entries-list');
  if(entries.length === 0){
    list.innerHTML = `<div class="empty-state" style="padding:24px 0">אין עדיין רשומות ללקוח זה.</div>`;
    return;
  }
  const displayList = entries.slice().reverse();
  list.innerHTML = displayList.map((e, i) => {
    const canUp = i > 0;
    const canDown = i < displayList.length-1;
    return `
    <div class="entry-row">
      <div style="display:flex; align-items:center; gap:6px;">
        <div class="entry-move">
          <button class="entry-move-btn" onclick="moveEntryUp('${e.id}')" ${canUp ? '' : 'disabled'}>▲</button>
          <button class="entry-move-btn" onclick="moveEntryDown('${e.id}')" ${canDown ? '' : 'disabled'}>▼</button>
        </div>
        <div class="entry-left">
          <div class="entry-desc">${escapeHtml(e.description || entryLabel(e))}</div>
          <div class="entry-date">${heDate(e.date)}${e.shipment ? ' · 📦 ' + escapeHtml(e.shipment) : ''}${isDisc(e) ? ' · מקורי ' + fmt(entryOrig(e), e.currency || 'ILS') : ''}</div>
        </div>
      </div>
      <div class="entry-amt ${e.type}">
        ${e.type==='debt' ? '+' : '−'}${fmt(e.amount, e.currency || 'ILS')}
        <button class="entry-del" onclick="deleteEntry('${e.id}')">✕</button>
      </div>
    </div>
  `;
  }).join('');
}

  opts += `<option value="__custom__" ${selectedId==='__custom__'?'selected':''}>+ מוצר חדש...</option>`;

function addProductLine(scope){
  scope = scope || 'debt';
  const rowId = uid();
  const wrap = document.getElementById(scope === 'credit' ? 'credit-product-lines' : 'product-lines');
  const row = document.createElement('div');
  row.className = 'product-line';
  row.dataset.rowId = rowId;
  row.dataset.scope = scope;
  row.innerHTML = `
    <select class="pl-product" onchange="onProductSelect('${rowId}')">${productOptionsHtml(state.products[0] ? undefined : '__custom__')}</select>
    <input class="pl-qty" type="number" value="1" min="0" oninput="recalcProductLine('${rowId}')" placeholder="כמות">
    <input class="pl-price" type="number" value="0" min="0" oninput="recalcProductLine('${rowId}')" placeholder="מחיר ליח'">
    <div class="pl-subtotal" id="sub-${rowId}">₪0</div>
    <button type="button" class="pl-del" onclick="removeProductLine('${rowId}')">✕</button>
    ${scope === 'debt' ? `<div class="pl-orig-row"><span>מחיר מקורי לפני הנחה (לא חובה):</span><input class="pl-orig" type="number" min="0" step="any" inputmode="decimal" placeholder="—" oninput="recalcProductLine('${rowId}')"><span class="pl-disc" id="disc-${rowId}"></span></div>` : ''}
    <div class="pl-hint" id="hint-${rowId}" style="grid-column:1/-1; font-size:10px; color:rgba(255,255,255,0.35); margin-top:-4px;"></div>
    <input class="pl-name-custom" placeholder="שם המוצר החדש" style="display:${state.products.length?'none':'block'}" oninput="recalcProductTotal('${scope}')">
  `;
  wrap.appendChild(row);
  onProductSelect(rowId, true);
  recalcProductLine(rowId);
}

function onProductSelect(rowId, skipRecalc){
  const row = document.querySelector(`.product-line[data-row-id="${rowId}"]`);
  if(!row) return;
  const sel = row.querySelector('.pl-product');
  const priceInput = row.querySelector('.pl-price');
  const customInput = row.querySelector('.pl-name-custom');
  const hint = row.querySelector('.pl-hint');
  if(sel.value === '__custom__'){
    customInput.style.display = 'block';
    hint.textContent = '';
  } else {
    customInput.style.display = 'none';
    const p = state.products.find(x => x.id === sel.value);
    const clientPrice = getClientPrice(currentClientId, sel.value);
    if(clientPrice !== null){
      priceInput.value = clientPrice;
      hint.textContent = '💬 המחיר האחרון שסוכם עם הלקוח הזה';
    } else if(p){
      priceInput.value = p.price;
      hint.textContent = '📦 מחיר ברירת מחדל (עדיין לא נמכר ללקוח זה)';
    } else {
      hint.textContent = '';
    }
  }
  if(!skipRecalc) recalcProductLine(rowId);
}

function removeProductLine(rowId){
  const row = document.querySelector(`.product-line[data-row-id="${rowId}"]`);
  const scope = row ? (row.dataset.scope || 'debt') : 'debt';
  if(row) row.remove();
  recalcProductTotal(scope);
}

function recalcProductLine(rowId){
  const row = document.querySelector(`.product-line[data-row-id="${rowId}"]`);
  if(!row) return;
  const scope = row.dataset.scope || 'debt';
  const qty = parseFloat(row.querySelector('.pl-qty').value) || 0;
  const price = parseFloat(row.querySelector('.pl-price').value) || 0;
  const currency = document.getElementById(scope === 'credit' ? 'nc-currency' : 'nd-currency').value;
  document.getElementById('sub-' + rowId).textContent = fmt(qty * price, currency);
  const origEl = row.querySelector('.pl-orig');
  const discEl = document.getElementById('disc-' + rowId);
  if(origEl && discEl){
    const orig = parseFloat(origEl.value) || 0;
    discEl.textContent = (orig > price && qty > 0) ? 'הנחה: ' + fmt(qty * (orig - price), currency) : '';
  }
  recalcProductTotal(scope);
}

function recalcProductTotal(scope){
  scope = scope || 'debt';
  const currency = document.getElementById(scope === 'credit' ? 'nc-currency' : 'nd-currency').value;
  const containerId = scope === 'credit' ? 'credit-product-lines' : 'product-lines';
  let total = 0, origTotal = 0;
  document.querySelectorAll(`#${containerId} .product-line`).forEach(row => {
    const qty = parseFloat(row.querySelector('.pl-qty').value) || 0;
    const price = parseFloat(row.querySelector('.pl-price').value) || 0;
    const origEl = row.querySelector('.pl-orig');
    const orig = origEl ? (parseFloat(origEl.value) || 0) : 0;
    total += qty * price;
    origTotal += qty * (orig > price ? orig : price);
  });
  const hasDisc = origTotal - total > 1e-9;
  document.getElementById(scope === 'credit' ? 'credit-total-display' : 'product-total-display').textContent =
    fmt(total, currency) + (hasDisc ? ' (במקום ' + fmt(origTotal, currency) + ')' : '');
}

function recalcAllProductLines(scope){
  scope = scope || 'debt';
  const containerId = scope === 'credit' ? 'credit-product-lines' : 'product-lines';
  document.querySelectorAll(`#${containerId} .product-line`).forEach(row => recalcProductLine(row.dataset.rowId));
}

function addDebtFromProducts(){
  const date = document.getElementById('nd-date').value || today();
  const currency = document.getElementById('nd-currency').value;
  const shipment = document.getElementById('nd-shipment').value.trim();
  const rows = Array.from(document.querySelectorAll('#product-lines .product-line'));
  let addedAny = false;

  rows.forEach(row => {
    const sel = row.querySelector('.pl-product');
    const qty = parseFloat(row.querySelector('.pl-qty').value) || 0;
    const price = parseFloat(row.querySelector('.pl-price').value) || 0;
    const origInput = row.querySelector('.pl-orig');
    const origPrice = origInput ? (parseFloat(origInput.value) || 0) : 0;
    let name, productId;
    if(sel.value === '__custom__'){
      name = row.querySelector('.pl-name-custom').value.trim();
      const existing = state.products.find(p => p.name === name);
      if(existing){
        productId = existing.id;
      } else if(name){
        productId = uid();
        state.products.push({ id: productId, name, price });
      }
    } else {
      const p = state.products.find(x => x.id === sel.value);
      name = p ? p.name : '';
      productId = sel.value;
    }
    if(!name || qty <= 0) return;
    addedAny = true;
    const description = `${qty} יח' ${name}`;
    const entry = { id: uid(), clientId: currentClientId, type: 'debt', amount: qty * price, date, description, currency, qty, unitPrice: price, shipment, order: ++state.seq };
    if(origPrice > price){ entry.origPrice = origPrice; entry.origAmount = qty * origPrice; }
    state.entries.push(entry);
    // Remember this as the price agreed with THIS client for THIS product — prices are dynamic per client.
    if(productId) setClientPrice(currentClientId, productId, price);
  });

  if(!addedAny){ alert('נא להזין לפחות מוצר אחד עם כמות תקינה'); return; }
  save();
  document.getElementById('product-lines').innerHTML = '';
  addProductLine('debt');

/* PDF export */
function pdfHead(disc, withBal){
  const cols = disc
    ? ['תאריך','תיאור','כמות','מחיר מקורי','מחיר אחרי הנחה','סה"כ מקורי','סה"כ אחרי הנחה']
    : ['תאריך','תיאור','כמות',"מחיר יח'",'סה"כ'];
  if(withBal) cols.push('יתרה');
  return `<thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>`;
}

function pdfRow(e, cur, disc, running){
  const isDebt = e.type === 'debt';
  const sign = isDebt ? '+' : '−';
  const qtyCell = (e.qty !== undefined && e.qty !== null) ? e.qty : '—';
  const unit = (e.unitPrice !== undefined && e.unitPrice !== null) ? fmt(e.unitPrice, cur.code) : '—';
  let cells = `<td>${heDate(e.date)}</td><td>${escapeHtml(e.description || entryLabel(e))}</td><td>${qtyCell}</td>`;
  if(disc){
    const ou = (e.unitPrice !== undefined && e.unitPrice !== null) ? fmt(entryOrigUnit(e), cur.code) : '—';
    cells += `<td>${ou}</td><td>${unit}</td><td>${isDebt ? '+' + fmt(entryOrig(e), cur.code) : '—'}</td><td>${sign}${fmt(e.amount, cur.code)}</td>`;
  } else {
    cells += `<td>${unit}</td><td>${sign}${fmt(e.amount, cur.code)}</td>`;
  }
  if(running !== null) cells += `<td>${fmt(running, cur.code)}</td>`;
  return `<tr>${cells}</tr>`;
}

function sumFinal(items){ return items.reduce((s, e) => s + Number(e.amount), 0); }
function sumOrig(items){ return items.reduce((s, e) => s + entryOrig(e), 0); }

async function exportClientPdf(){
  const c = state.clients.find(x => x.id === currentClientId);
  if(!c) return;
  const totals = clientTotalsByCurrency(c.id);
  const usedCurrencies = CURRENCIES.filter(cur => totals[cur.code]);
  const entries = clientEntriesSorted(c.id);

  let sectionsHtml = '';
  if(usedCurrencies.length === 0){
    sectionsHtml = `
      <div class="p-summary">
        <div class="p-sbox"><div class="n" style="color:#c0392b">${fmt(0)}</div><div class="l">סה"כ חוב מקורי</div></div>
        <div class="p-sbox"><div class="n" style="color:#2d6a4f">${fmt(0)}</div><div class="l">סה"כ שולם</div></div>
        <div class="p-sbox"><div class="n" style="color:#16281f">${fmt(0)}</div><div class="l">יתרה לתשלום</div></div>
      </div>
      <table>
        ${pdfHead(false, true)}
        <tbody><tr><td colspan="6" style="text-align:center;color:#999">אין רשומות</td></tr></tbody>
      </table>`;
  } else {
    usedCurrencies.forEach(cur => {
      const t = totals[cur.code];
      const curEntries = entries.filter(e => (e.currency || 'ILS') === cur.code);
      const debtEntries = curEntries.filter(e => e.type === 'debt');
      const otherEntries = curEntries.filter(e => e.type !== 'debt');
      const disc = debtEntries.some(isDisc);
      const sf = sumFinal(debtEntries), so = sumOrig(debtEntries);

      // Group debt rows by shipment/batch, preserving the order each shipment first appears in.
      const groups = [];
      const groupIndex = {};
      debtEntries.forEach(e => {
        const key = e.shipment || '';
        if(!(key in groupIndex)){ groupIndex[key] = groups.length; groups.push({ key, items: [] }); }
        groups[groupIndex[key]].items.push(e);
      });
      const useGrouping = groups.length > 1 || (groups.length === 1 && groups[0].key !== '');

      let tablesHtml = '';
      if(!useGrouping){
        // No shipments in use: one flat table with a running balance column across everything.
        let running = 0;
        const rows = curEntries.map(e => {
          running += (e.type === 'debt' ? e.amount : -e.amount);
          return pdfRow(e, cur, disc, running);
        }).join('');
        const totalRows = disc
          ? `<tr><td colspan="5" style="font-weight:700">סה"כ חובות</td><td style="font-weight:700">+${fmt(so, cur.code)}</td><td style="font-weight:700">+${fmt(sf, cur.code)}</td><td></td></tr>

/* Per-shipment documents */
let shipmentKeys = [];
const NO_SHIPMENT = 'ללא שיוך למשלוח';

function clientShipmentGroups(clientId){
  const debts = clientEntriesSorted(clientId).filter(e => e.type === 'debt');
  const groups = [];
  const idx = {};
  debts.forEach(e => {
    const key = e.shipment || '';
    if(!(key in idx)){ idx[key] = groups.length; groups.push({ key, items: [] }); }
    groups[idx[key]].items.push(e);
  });
  return groups;
}

function openShipments(){
  const groups = clientShipmentGroups(currentClientId);
  if(groups.length === 0 || (groups.length === 1 && groups[0].key === '')){
    alert('לא הוגדרו משלוחים ללקוח זה. כשמוסיפים חוב אפשר למלא את השדה "משלוח / קבוצה".');
    return;
  }
  shipmentKeys = groups.map(g => g.key);
  document.getElementById('shipments-list').innerHTML = groups.map((g, i) => {
    const byCur = {};
    g.items.forEach(e => { const k = e.currency || 'ILS'; byCur[k] = (byCur[k] || 0) + Number(e.amount); });
    const totals = CURRENCIES.filter(c => byCur[c.code] !== undefined).map(c => fmt(byCur[c.code], c.code)).join(' · ');
    return `<div class="catalog-row">
      <div><div>📦 ${escapeHtml(g.key || NO_SHIPMENT)}</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.45)">${g.items.length} שורות · ${totals}</div></div>
      <button class="btn btn-gold btn-sm" onclick="exportShipmentPdf(${i})">📄 PDF</button>
    </div>`;
  }).join('');
  openModal('overlay-shipments');
}

async function exportShipmentPdf(i){
  const c = state.clients.find(x => x.id === currentClientId);
  const key = shipmentKeys[i];
  if(!c || key === undefined) return;
  const items = clientShipmentGroups(c.id).find(g => g.key === key);
  if(!items) return;
  const label = key || NO_SHIPMENT;
  let body = `<div style="font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:16px;margin:4px 0 10px;color:#1a3d2b">📦 ${escapeHtml(label)}</div>`;
  CURRENCIES.forEach(cur => {
    const rowsE = items.items.filter(e => (e.currency || 'ILS') === cur.code);
    if(rowsE.length === 0) return;
    const disc = rowsE.some(isDisc);
    const rows = rowsE.map(e => pdfRow(e, cur, disc, null)).join('');
    const subRow = disc
      ? `<tr><td colspan="5" style="font-weight:700">סה"כ למשלוח</td><td style="font-weight:700">${fmt(sumOrig(rowsE), cur.code)}</td><td style="font-weight:700">${fmt(sumFinal(rowsE), cur.code)}</td></tr>`
      : `<tr><td colspan="4" style="font-weight:700">סה"כ למשלוח</td><td style="font-weight:700">${fmt(sumFinal(rowsE), cur.code)}</td></tr>`;
    body += `
      ${CURRENCIES.filter(x => items.items.some(e => (e.currency || 'ILS') === x.code)).length > 1 ? `<div style="font-weight:700;font-size:13px;margin:14px 0 6px;color:#1a3d2b">${cur.label}</div>` : ''}
      <table class="${disc ? 'wide' : ''}">
        ${pdfHead(disc, false)}
        <tbody>${rows}${subRow}</tbody>
      </table>`;
  });
  const safeName = c.name.replace(/[^\wא-ת\d]+/g, '_');
  const safeLabel = label.replace(/[^\wא-ת\d]+/g, '_');
  await renderPdfFile(c, 'דו"ח משלוח', body, `משלוח_${safeLabel}_${safeName}_${today()}.pdf`);
}

<script type="module">
const FB_VER = '12.18.0';
const OWNER = 'lurietrogim@gmail.com';
const FB_CONFIG = {
  apiKey: "AIzaSyDeEqKUSOUvlJadmkaJ_E9qx-BifkpnKg4",
  authDomain: "luria-farm.firebaseapp.com",
  projectId: "luria-farm",

  messagingSenderId: "977449076829",
  appId: "1:977449076829:web:2ef92d7bdb57690066a5b4"
};
const MODE_KEY = 'ldebts_mode';            // 'cloud' once migration verified
const BASE_KEY = 'ldebts_cloud_baseline';  // last known cloud content (to find unsent local changes)
const PRE_KEY  = 'ldebts1_before_cloud';   // untouched copy of local data from before the move
const COLS = { c: 'clients', e: 'entries', p: 'products' };

const D = window.__debts;
const bar = document.getElementById('cloud-bar');
const $ = id => document.getElementById(id);
const isCloud = () => localStorage.getItem(MODE_KEY) === 'cloud';

let F = null, auth = null, db = null, user = null;
let ready = false, syncStarted = false, pending = 0, lastErr = null, authMsg = '';

/* ---------- records: the app state as a flat map of documents ---------- */
const clean = o => JSON.parse(JSON.stringify(o));
function stable(v){
  if(Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if(v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v);
}
function toRecords(s){
  const r = {};
  (s.clients || []).forEach(x => r['c/' + x.id] = clean(x));
  (s.entries || []).forEach(x => r['e/' + x.id] = clean(x));
  (s.products || []).forEach(x => r['p/' + x.id] = clean(x));
  r.meta = clean({ clientPrices: s.clientPrices || {}, seq: s.seq || 0 });
  return r;
}
function fromRecords(r){
  const s = { clients: [], entries: [], products: [], clientPrices: {}, seq: 0 };
  Object.keys(r).sort().forEach(k => {
    const v = r[k];
    if(k === 'meta'){ s.clientPrices = v.clientPrices || {}; s.seq = v.seq || 0; return; }
    ({ c: s.clients, e: s.entries, p: s.products })[k[0]].push(v);
  });
  return s;
}
function diff(cur, base){
  const ops = [];
  for(const k in cur) if(base[k] !== stable(cur[k])) ops.push({ k, v: cur[k] });
  for(const k in base) if(!(k in cur)) ops.push({ k, del: true });
  return ops;
}
const loadBase = () => { try { return JSON.parse(localStorage.getItem(BASE_KEY)) || {}; } catch(e){ return {}; } };
function saveBase(recs){ const b = {}; for(const k in recs) b[k] = stable(recs[k]); localStorage.setItem(BASE_KEY, JSON.stringify(b)); }
function isEmptyLocal(s){ return !s.clients.length && !s.entries.length && !s.products.length && !Object.keys(s.clientPrices || {}).length; }
function labelOf(k, v, s){
  if(k === 'meta') return 'מחירים מוסכמים ללקוחות';
  if(k[0] === 'c') return 'לקוח: ' + (v.name || k);
  if(k[0] === 'p') return 'מוצר: ' + (v.name || k);
  const c = s.clients.find(x => x.id === v.clientId);
  return 'רשומה: ' + (c ? c.name + ' · ' : '') + (v.date || '') + ' · ' + (v.description || v.type || '') + ' · ' + (v.amount ?? '');
}
function badIds(recs){
  return Object.keys(recs).filter(k => k !== 'meta').filter(k => {
    const id = k.slice(2);
    return !id || id.includes('/') || id === '.' || id === '..' || /^__.*__$/.test(id);
  });
}

/* ---------- Firebase ---------- */
async function ensureFb(){
  if(F) return;
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [app, a, fs] = await Promise.all([
    import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')
  ]);
  const fbApp = app.initializeApp(FB_CONFIG);
  auth = a.getAuth(fbApp);
  try {
    db = fs.initializeFirestore(fbApp, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) });
  } catch(e){ db = fs.getFirestore(fbApp); }
  F = { ...a, ...fs };
}
const ref = k => k === 'meta' ? F.doc(db, 'debts', 'main') : F.doc(db, 'debts', 'main', COLS[k[0]], k.slice(2));
const isOwner = u => !!u && (u.email || '').toLowerCase() === OWNER;

function signIn(){
  const p = new F.GoogleAuthProvider();
  p.setCustomParameters({ prompt: 'select_account', login_hint: OWNER });
  return F.signInWithPopup(auth, p);
}

async function readServer(){
  const r = {};
  const m = await F.getDocFromServer(ref('meta'));
  if(m.exists()) r.meta = m.data();
  for(const [t, col] of Object.entries(COLS)){
    const qs = await F.getDocsFromServer(F.collection(db, 'debts', 'main', col));
    qs.forEach(d => r[t + '/' + d.id] = d.data());
  }
  return r;
}

function commitOps(ops){
  for(let i = 0; i < ops.length; i += 400){
    const b = F.writeBatch(db);
    ops.slice(i, i + 400).forEach(o => o.del ? b.delete(ref(o.k)) : b.set(ref(o.k), o.v));
    pending++; setStatus();
    b.commit().then(() => { pending--; lastErr = null; setStatus(); })
              .catch(err => { pending--; lastErr = err; console.error(err); setStatus(); });
  }
}

// Called by the app's save(): send whatever changed since the last known cloud state.
window.cloudPush = function(){
  if(!isCloud() || !ready) return;   // not connected yet: changes wait in the device and go up on connect
  const cur = toRecords(D.get());
  const ops = diff(cur, loadBase());
  if(!ops.length) return;
  saveBase(cur);
  commitOps(ops);
};

function startSync(){
  if(syncStarted) return; syncStarted = true;
  const snaps = { meta: null, c: null, e: null, p: null };
  const onErr = err => { lastErr = err; console.error(err); setStatus(); };
  F.onSnapshot(ref('meta'), s => snaps.meta = s, onErr);
  for(const [t, col] of Object.entries(COLS)) F.onSnapshot(F.collection(db, 'debts', 'main', col), s => snaps[t] = s, onErr);
  let first = true;
  F.onSnapshotsInSync(db, () => {
    if(Object.values(snaps).some(x => x === null)) return;
    const cloud = {};
    if(snaps.meta.exists()) cloud.meta = snaps.meta.data();
    for(const t of Object.keys(COLS)) snaps[t].forEach(d => cloud[t + '/' + d.id] = d.data());
    if(first){
      first = false;
      // Changes made on this device while it wasn't connected are applied on top of the cloud copy.
      const localOps = diff(toRecords(D.get()), loadBase());
      const merged = { ...cloud };
      localOps.forEach(o => { if(o.del) delete merged[o.k]; else merged[o.k] = o.v; });
      saveBase(cloud);
      ready = true;
      D.set(fromRecords(merged));
      window.cloudPush();
      setStatus();
      return;
    }
    saveBase(cloud);
    const next = fromRecords(cloud);
    if(stable(toRecords(next)) !== stable(toRecords(D.get()))) D.set(next);
    setStatus();
  });
  pending++; setStatus();
  F.waitForPendingWrites(db).then(() => { pending--; setStatus(); }).catch(() => { pending--; setStatus(); });
}

async function bootCloud(){
  setStatus();
  try { await ensureFb(); } catch(e){ lastErr = e; setStatus(); return; }
  F.onAuthStateChanged(auth, async u => {
    if(u && !isOwner(u)){ authMsg = `החשבון ${u.email} אינו מורשה. יש להתחבר עם ${OWNER}.`; await F.signOut(auth); return; }
    user = u || null;
    if(user){ authMsg = ''; startSync(); }
    setStatus();
  });
}

/* ---------- status bar ---------- */
function setStatus(){
  if(!isCloud()){
    bar.innerHTML = `<button class="cloud-pill warn" onclick="cloudOpenMigrate()">☁️ העבר לענן</button>
                     <button class="cloud-pill" onclick="cloudBackup()">💾 גיבוי לקובץ</button>`;

  let cls = 'ok', txt = '☁️ נשמר בענן';
  if(lastErr && lastErr.code === 'permission-denied'){ cls = 'err'; txt = '⚠️ אין הרשאה – לחץ לפרטים'; }
  else if(!F && lastErr){ cls = 'err'; txt = '📴 עובד במכשיר בלבד'; }
  else if(!user){ cls = 'warn'; txt = auth ? '🔒 התחבר לענן' : '⏳ מתחבר…'; }
  else if(!ready){ cls = 'warn'; txt = '⏳ טוען מהענן…'; }
  else if(!navigator.onLine){ cls = 'warn'; txt = '📴 אין חיבור – נשמר במכשיר'; }
  else if(lastErr){ cls = 'err'; txt = '⚠️ שגיאה בשמירה – לחץ לפרטים'; }
  else if(pending > 0){ cls = 'warn'; txt = '⏳ שולח…'; }

}

window.cloudBackup = function(tag){
  const data = JSON.stringify(D.get(), null, 1);

  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
  a.href = URL.createObjectURL(blob);
  a.download = `luria-debts-backup_${tag || 'manual'}_${stamp}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
};

/* ---------- migration (local → cloud) ---------- */
const STEPS = ['התחברות לחשבון העסק', 'גיבוי לקובץ במכשיר', 'בדיקת מה שיש בענן', 'העלאת הנתונים', 'אימות מלא של כל רשומה', 'מעבר לעבודה מול הענן'];
function drawSteps(cur, failed){
  return `<div class="mig-steps">${STEPS.map((s, i) => {
    const ic = i < cur ? '✅' : i === cur ? (failed ? '❌' : '⏳') : '⬜';
    return `<div class="st"><span class="ic">${ic}</span><span>${s}</span></div>`;
  }).join('')}</div>`;
}
function migView(cur, msg, opts = {}){
  $('cloud-body').innerHTML = drawSteps(cur, opts.failed) +
    `<div class="mig-msg">${msg || ''}</div>` +
    (opts.list && opts.list.length ? `<div class="mig-list">${opts.list.map(escapeHtml).join('<br>')}</div>` : '') +
    (opts.buttons || '');
}

window.cloudOpenMigrate = function(){
  $('cloud-title').textContent = '☁️ העברה לענן';
  const s = D.get();
  $('cloud-body').innerHTML = `
    <div class="mig-msg" style="margin-top:0">

      <br>• קודם יורד לטלפון <b>קובץ גיבוי</b> של כל הנתונים.
      <br>• שום דבר שכבר קיים בענן לא נדרס.
      <br>• אחרי ההעלאה כל רשומה נבדקת מול המקור. רק אם הכול זהה, המערכת עוברת לענן.
      <br>• העותק בטלפון <b>לא נמחק</b>.
      <br><br>במכשיר הזה: <b>${s.clients.length}</b> לקוחות, <b>${s.entries.length}</b> רשומות, <b>${s.products.length}</b> מוצרים.
    </div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-gold" style="flex:1" id="mig-go" disabled>⏳ טוען…</button>
      <button class="btn btn-outline" onclick="closeModal('overlay-cloud')">ביטול</button>
    </div>`;
  openModal('overlay-cloud');
  ensureFb().then(() => {
    const b = $('mig-go'); if(!b) return;
    b.disabled = false; b.textContent = 'התחל';
    b.onclick = runMigration;   // popup must open straight from the tap
  }).catch(e => {
    const b = $('mig-go'); if(b) b.textContent = 'אין חיבור לאינטרנט';
  });
};

async function runMigration(){
  let step = 0;
  const fail = (msg, list) => migView(step, msg, { failed: true, list,
    buttons: `<div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-gold" style="flex:1" onclick="cloudOpenMigrate()">נסה שוב</button><button class="btn btn-outline" onclick="closeModal('overlay-cloud')">סגור</button></div>` });
  try {
    // 1. sign in
    migView(step, 'נפתח חלון התחברות של Google…');
    let u = auth.currentUser;
    if(!isOwner(u)){
      if(u) await F.signOut(auth);
      u = (await signIn()).user;
    }
    if(!isOwner(u)){ await F.signOut(auth); return fail(`החשבון ${u.email} אינו מורשה. יש להתחבר עם ${OWNER}.`); }
    user = u; step = 1;

    // 2. backup
    migView(step, 'מוריד קובץ גיבוי…');
    if(!localStorage.getItem(PRE_KEY)) localStorage.setItem(PRE_KEY, JSON.stringify(D.get()));
    cloudBackup('before-cloud');
    step = 2;

    // 3. what is in the cloud
    migView(step, 'בודק מה כבר קיים בענן…');
    const s = D.get();
    const local = toRecords(s);
    const bad = badIds(local);
    if(bad.length) return fail('יש רשומות עם מזהה לא תקין, ולכן לא ניתן להעביר אותן. שום דבר לא השתנה.', bad);
    let cloud;
    try { cloud = await readServer(); } catch(e){ return fail('אין חיבור לענן כרגע (' + (e.code || e.message) + '). שום דבר לא השתנה, אפשר לנסות שוב.'); }

    if(isEmptyLocal(s)){
      // A new device: nothing here to upload, just start working from the cloud.
      step = 5; return finish(cloud, 0);
    }

    const toUpload = [], conflicts = [];
    const expected = { ...local };
    for(const k in local){
      if(!(k in cloud)){ toUpload.push(k); continue; }
      if(stable(cloud[k]) === stable(local[k])) continue;
      if(k === 'meta'){
        const cp = { ...(cloud.meta.clientPrices || {}) };
        let clash = false;
        for(const [cid, prices] of Object.entries(local.meta.clientPrices || {})){
          cp[cid] = { ...(cp[cid] || {}) };
          for(const [pid, price] of Object.entries(prices)){
            if(pid in cp[cid] && cp[cid][pid] !== price) clash = true;
            cp[cid][pid] = price;
          }
        }
        if(clash){ conflicts.push(labelOf(k)); continue; }
        expected.meta = clean({ clientPrices: cp, seq: Math.max(cloud.meta.seq || 0, local.meta.seq || 0) });
        toUpload.push(k);
        continue;
      }
      conflicts.push(labelOf(k, local[k], s));
    }
    if(conflicts.length) return fail('בענן כבר יש גרסה אחרת של הרשומות הבאות. כדי לא לדרוס אף אחת מהן, ההעברה נעצרה ושום דבר לא השתנה:', conflicts);
    step = 3;

    // 4. upload (only what's missing, so a re-run continues where it stopped)
    for(let i = 0; i < toUpload.length; i += 400){
      migView(step, `מעלה… ${Math.min(i + 400, toUpload.length)} מתוך ${toUpload.length}`);
      const b = F.writeBatch(db);
      toUpload.slice(i, i + 400).forEach(k => b.set(ref(k), expected[k]));
      await b.commit();
    }
    step = 4;

    // 5. read everything back from the server and compare record by record
    migView(step, 'קורא את הכול בחזרה מהענן ומשווה רשומה אחרי רשומה…');
    const after = await readServer();
    const missing = Object.keys(expected).filter(k => !(k in after) || stable(after[k]) !== stable(expected[k]));
    if(missing.length) return fail('הרשומות הבאות לא הגיעו לענן בצורה זהה. המערכת נשארת במצב מקומי:', missing.map(k => labelOf(k, expected[k], s)));
    step = 5;
    return finish(after, Object.keys(expected).length - 1);
  } catch(e){
    console.error(e);
    return fail('התהליך נעצר: ' + (e.code || e.message) + '. המערכת נשארת במצב מקומי בדיוק כמו קודם.');
  }
}

function finish(cloud, checked){
  saveBase(cloud);
  localStorage.setItem(MODE_KEY, 'cloud');
  const st = fromRecords(cloud);
  D.set(st);
  startSync();
  setStatus();
  migView(6, `<b>ההעברה הושלמה.</b><br>
    ${checked ? `${checked} רשומות נבדקו אחת־אחת ונמצאו זהות למקור.<br>` : 'הנתונים נטענו מהענן.<br>'}
    בענן עכשיו: <b>${st.clients.length}</b> לקוחות, <b>${st.entries.length}</b> רשומות, <b>${st.products.length}</b> מוצרים.<br>
    מעכשיו כל שמירה נשלחת לענן. העותק במכשיר לא נמחק.<br>
    כדאי לפתוח לקוח או שניים שאתה מכיר ולוודא שהכול נראה נכון.`,
    { buttons: `<button class="btn btn-gold" style="width:100%;margin-top:16px" onclick="closeModal('overlay-cloud')">סגור</button>` });
}

/* ---------- boot ---------- */
if(isCloud()) bootCloud(); else setStatus();
</script>
